      - name: Patch SmritiAI mobile controls
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re
          import shutil

          html_path = Path(
              "android_wrapper/app/src/main/assets/smritiai/index.html"
          )

          if not html_path.exists():
              raise SystemExit("ERROR: index.html not found")

          html = html_path.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          # ----------------------------------------------------------
          # BACKUP ORIGINAL
          # ----------------------------------------------------------

          backup = html_path.with_name(
              "index_original_before_android_patch.html"
          )

          shutil.copy2(html_path, backup)

          # ----------------------------------------------------------
          # FIND EXISTING MUSIC
          # ----------------------------------------------------------

          root = Path(
              "android_wrapper/app/src/main/assets/smritiai"
          )

          music_candidates = [
              root / "assets/audio/welcome_nostalgia.wav",
              root / "audio/welcome_nostalgia.wav",
              root / "welcome_nostalgia.wav",
          ]

          music_path = None

          for candidate in music_candidates:
              if candidate.exists():
                  music_path = candidate
                  break

          if music_path is None:
              wav_files = list(root.rglob("*.wav"))

              if wav_files:
                  music_path = wav_files[0]

          if music_path:
              music_source = music_path.relative_to(root).as_posix()
              print("Music found:", music_source)
          else:
              music_source = ""
              print("No WAV file found. Existing WebAudio will remain available.")

          # ----------------------------------------------------------
          # CSS
          # ----------------------------------------------------------

          css = r"""
          <style id="smritiai-final-android-style">

          #smritiai-android-controls {
              position: fixed !important;
              right: max(12px, env(safe-area-inset-right)) !important;
              bottom: max(16px, env(safe-area-inset-bottom)) !important;
              z-index: 2147483647 !important;

              display: flex !important;
              flex-direction: column !important;
              align-items: center !important;
              gap: 10px !important;

              pointer-events: auto !important;

              font-family:
                  system-ui,
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif !important;
          }

          .smritiai-android-icon {
              width: 48px !important;
              height: 48px !important;

              min-width: 48px !important;
              min-height: 48px !important;

              max-width: 48px !important;
              max-height: 48px !important;

              border-radius: 50% !important;

              border: 2px solid rgba(255,255,255,0.95) !important;

              background: rgba(37,99,235,0.97) !important;

              color: white !important;

              box-shadow:
                  0 4px 14px rgba(0,0,0,0.28) !important;

              display: flex !important;
              align-items: center !important;
              justify-content: center !important;

              font-size: 22px !important;
              line-height: 1 !important;

              padding: 0 !important;
              margin: 0 !important;

              cursor: pointer !important;

              -webkit-tap-highlight-color: transparent !important;

              user-select: none !important;

              opacity: 1 !important;
              visibility: visible !important;

              pointer-events: auto !important;
          }

          .smritiai-android-icon:active {
              transform: scale(0.92) !important;
          }

          #smritiai-caregiver-icon {
              background: rgba(16,185,129,0.97) !important;
          }

          #smritiai-music-icon {
              background: rgba(124,58,237,0.97) !important;
          }

          #smritiai-logout-icon {
              background: rgba(220,38,38,0.97) !important;
          }

          #smritiai-music-player {
              position: fixed !important;

              left: 50% !important;
              transform: translateX(-50%) !important;

              bottom:
                  max(
                      84px,
                      calc(84px + env(safe-area-inset-bottom))
                  ) !important;

              z-index: 2147483646 !important;

              background: rgba(255,255,255,0.98) !important;

              border-radius: 18px !important;

              padding: 12px !important;

              box-shadow:
                  0 8px 30px rgba(0,0,0,0.25) !important;

              display: none !important;

              align-items: center !important;

              gap: 10px !important;

              max-width: calc(100vw - 32px) !important;

              box-sizing: border-box !important;
          }

          #smritiai-music-player.smritiai-visible {
              display: flex !important;
          }

          #smritiai-music-player audio {
              width: min(280px, 65vw) !important;
              height: 40px !important;
          }

          #smritiai-music-close {
              border: none !important;

              background: #ef4444 !important;

              color: white !important;

              border-radius: 50% !important;

              width: 34px !important;
              height: 34px !important;

              min-width: 34px !important;

              font-size: 17px !important;
              font-weight: bold !important;

              cursor: pointer !important;
          }

          /*
           * Hide only the persistent RUDAS + Progress navigation.
           *
           * Actual RUDAS assessment screens are NOT hidden.
           */

          .smritiai-hidden-rudas-navigation {
              display: none !important;
              visibility: hidden !important;
              pointer-events: none !important;
          }

          /*
           * Hide the old large caregiver navigation button.
           */

          .smritiai-hidden-caregiver-navigation {
              display: none !important;
              visibility: hidden !important;
              pointer-events: none !important;
          }

          </style>
          """

          # ----------------------------------------------------------
          # JAVASCRIPT
          # ----------------------------------------------------------

          javascript = r"""
          <script id="smritiai-final-android-script">

          (function () {

              "use strict";

              console.log(
                  "[SmritiAI] Final Android controls loaded"
              );


              function normalizedText(element) {

                  if (!element) {
                      return "";
                  }

                  return (
                      element.innerText ||
                      element.textContent ||
                      element.getAttribute("aria-label") ||
                      element.getAttribute("title") ||
                      ""
                  )
                  .replace(/\s+/g, " ")
                  .trim()
                  .toLowerCase();

              }


              function getClickableElements() {

                  return Array.from(
                      document.querySelectorAll(
                          "button, a, [role='button'], input[type='button'], input[type='submit'], [onclick]"
                      )
                  );

              }


              /*
               * -----------------------------------------------------
               * EXISTING CAREGIVER CONTROL
               * -----------------------------------------------------
               */

              function findCaregiverControl() {

                  const elements =
                      getClickableElements();

                  for (const element of elements) {

                      if (
                          element.closest(
                              "#smritiai-android-controls"
                          )
                      ) {
                          continue;
                      }

                      const text =
                          normalizedText(element);

                      if (
                          text === "connect caregiver" ||
                          text === "connect to caregiver" ||
                          text === "caregiver connection"
                      ) {
                          return element;
                      }

                  }


                  for (const element of elements) {

                      if (
                          element.closest(
                              "#smritiai-android-controls"
                          )
                      ) {
                          continue;
                      }

                      const text =
                          normalizedText(element);

                      if (
                          text.includes("connect caregiver") ||
                          (
                              text.includes("caregiver") &&
                              text.includes("connect")
                          )
                      ) {
                          return element;
                      }

                  }

                  return null;

              }


              /*
               * -----------------------------------------------------
               * EXISTING LOGOUT CONTROL
               * -----------------------------------------------------
               */

              function findLogoutControl() {

                  const elements =
                      getClickableElements();

                  for (const element of elements) {

                      if (
                          element.closest(
                              "#smritiai-android-controls"
                          )
                      ) {
                          continue;
                      }

                      const text =
                          normalizedText(element);

                      if (
                          text === "logout" ||
                          text === "log out" ||
                          text === "sign out" ||
                          text === "signout"
                      ) {
                          return element;
                      }

                  }

                  return null;

              }


              /*
               * -----------------------------------------------------
               * HIDE ONLY RUDAS + PROGRESS NAVIGATION
               * -----------------------------------------------------
               */

              function hideRudasProgressNavigation() {

                  const elements =
                      getClickableElements();

                  elements.forEach(function (element) {

                      if (
                          element.closest(
                              "#smritiai-android-controls"
                          )
                      ) {
                          return;
                      }

                      const text =
                          normalizedText(element);

                      const isRudasProgress =
                          text.includes("rudas") &&
                          (
                              text.includes("progress") ||
                              text.includes("& progress") ||
                              text.includes("and progress")
                          );

                      if (!isRudasProgress) {
                          return;
                      }

                      element.classList.add(
                          "smritiai-hidden-rudas-navigation"
                      );

                  });

              }


              /*
               * -----------------------------------------------------
               * HIDE OLD LARGE CAREGIVER BUTTON
               * -----------------------------------------------------
               */

              function hideOldCaregiverButton() {

                  const button =
                      findCaregiverControl();

                  if (!button) {
                      return;
                  }

                  button.classList.add(
                      "smritiai-hidden-caregiver-navigation"
                  );

              }


              /*
               * -----------------------------------------------------
               * FALLBACK LOGOUT
               * -----------------------------------------------------
               */

              function fallbackLogout() {

                  console.log(
                      "[SmritiAI] Running logout fallback"
                  );


                  const keys = [

                      "smritiai_active_user",
                      "smritiai_current_user",
                      "smritiai_session",
                      "smritiai_auth",
                      "smritiai_user",
                      "currentUser",
                      "current_user",
                      "activeUser"

                  ];


                  keys.forEach(function (key) {

                      try {
                          localStorage.removeItem(key);
                      } catch (error) {}

                  });


                  const functions = [

                      "logout",
                      "handleLogout",
                      "signOut",
                      "doLogout",
                      "logoutUser"

                  ];


                  for (
                      let i = 0;
                      i < functions.length;
                      i++
                  ) {

                      const fn =
                          window[functions[i]];

                      if (
                          typeof fn === "function"
                      ) {

                          try {

                              fn();

                              return;

                          } catch (error) {

                              console.warn(
                                  "Logout function failed",
                                  error
                              );

                          }

                      }

                  }


                  window.location.reload();

              }


              /*
               * -----------------------------------------------------
               * MUSIC
               * -----------------------------------------------------
               */

              function openMusicPlayer() {

                  let player =
                      document.getElementById(
                          "smritiai-music-player"
                      );


                  if (player) {

                      player.classList.toggle(
                          "smritiai-visible"
                      );

                      return;

                  }


                  player =
                      document.createElement("div");

                  player.id =
                      "smritiai-music-player";


                  const audio =
                      document.createElement("audio");

                  audio.controls = true;

                  audio.loop = true;

                  audio.preload = "auto";


                  const musicSource =
                      "__SMRITIAI_MUSIC_SOURCE__";


                  if (musicSource) {

                      audio.src =
                          musicSource;

                  }


                  const closeButton =
                      document.createElement("button");

                  closeButton.id =
                      "smritiai-music-close";

                  closeButton.type =
                      "button";

                  closeButton.innerHTML =
                      "×";


                  closeButton.addEventListener(
                      "click",
                      function () {

                          try {
                              audio.pause();
                          } catch (error) {}

                          player.classList.remove(
                              "smritiai-visible"
                          );

                      }
                  );


                  player.appendChild(audio);

                  player.appendChild(closeButton);

                  document.body.appendChild(player);

                  player.classList.add(
                      "smritiai-visible"
                  );


                  if (musicSource) {

                      try {

                          audio.play().catch(
                              function () {}
                          );

                      } catch (error) {}

                  } else {

                      /*
                       * The original application's WebAudio
                       * nostalgia music remains untouched.
                       */

                      console.log(
                          "[SmritiAI] No WAV source found."
                      );

                  }

              }


              /*
               * -----------------------------------------------------
               * CREATE CONTROL BAR
               * -----------------------------------------------------
               */

              function createAndroidControls() {

                  if (
                      document.getElementById(
                          "smritiai-android-controls"
                      )
                  ) {
                      return;
                  }


                  if (!document.body) {
                      return;
                  }


                  const container =
                      document.createElement("div");

                  container.id =
                      "smritiai-android-controls";


                  /*
                   * CAREGIVER
                   */

                  const caregiver =
                      document.createElement("button");

                  caregiver.id =
                      "smritiai-caregiver-icon";

                  caregiver.className =
                      "smritiai-android-icon";

                  caregiver.type =
                      "button";

                  caregiver.innerHTML =
                      "👩‍⚕️";

                  caregiver.title =
                      "Connect Caregiver";

                  caregiver.setAttribute(
                      "aria-label",
                      "Connect Caregiver"
                  );


                  caregiver.addEventListener(
                      "click",
                      function () {

                          const original =
                              findCaregiverControl();

                          if (original) {

                              original.classList.remove(
                                  "smritiai-hidden-caregiver-navigation"
                              );

                              original.click();

                              setTimeout(
                                  function () {

                                      original.classList.add(
                                          "smritiai-hidden-caregiver-navigation"
                                      );

                                  },
                                  100
                              );

                              return;

                          }


                          const possibleFunctions = [

                              "openCaregiverConnection",
                              "connectCaregiver",
                              "showCaregiverConnection",
                              "openConnection",
                              "openCaregiver"

                          ];


                          for (
                              let i = 0;
                              i < possibleFunctions.length;
                              i++
                          ) {

                              const fn =
                                  window[
                                      possibleFunctions[i]
                                  ];

                              if (
                                  typeof fn === "function"
                              ) {

                                  try {

                                      fn();

                                      return;

                                  } catch (error) {}

                              }

                          }


                          alert(
                              "Caregiver connection is not available on this screen."
                          );

                      }
                  );


                  /*
                   * MUSIC
                   */

                  const music =
                      document.createElement("button");

                  music.id =
                      "smritiai-music-icon";

                  music.className =
                      "smritiai-android-icon";

                  music.type =
                      "button";

                  music.innerHTML =
                      "🎵";

                  music.title =
                      "Music";

                  music.setAttribute(
                      "aria-label",
                      "Music"
                  );


                  music.addEventListener(
                      "click",
                      function () {

                          openMusicPlayer();

                      }
                  );


                  /*
                   * LOGOUT
                   */

                  const logout =
                      document.createElement("button");

                  logout.id =
                      "smritiai-logout-icon";

                  logout.className =
                      "smritiai-android-icon";

                  logout.type =
                      "button";

                  logout.innerHTML =
                      "🚪";

                  logout.title =
                      "Logout";

                  logout.setAttribute(
                      "aria-label",
                      "Logout"
                  );


                  logout.addEventListener(
                      "click",
                      function () {

                          const original =
                              findLogoutControl();

                          if (original) {

                              original.click();

                          } else {

                              fallbackLogout();

                          }

                      }
                  );


                  container.appendChild(
                      caregiver
                  );

                  container.appendChild(
                      music
                  );

                  container.appendChild(
                      logout
                  );


                  document.body.appendChild(
                      container
                  );

              }


              /*
               * -----------------------------------------------------
               * INITIALIZE
               * -----------------------------------------------------
               */

              function initialize() {

                  if (!document.body) {
                      return;
                  }

                  hideRudasProgressNavigation();

                  hideOldCaregiverButton();

                  createAndroidControls();

              }


              /*
               * -----------------------------------------------------
               * WATCH DYNAMIC UI CHANGES
               * -----------------------------------------------------
               */

              function startObserver() {

                  if (!document.body) {
                      return;
                  }


                  const observer =
                      new MutationObserver(
                          function () {

                              hideRudasProgressNavigation();

                              hideOldCaregiverButton();

                              if (
                                  !document.getElementById(
                                      "smritiai-android-controls"
                                  )
                              ) {

                                  createAndroidControls();

                              }

                          }
                      );


                  observer.observe(
                      document.body,
                      {
                          childList: true,
                          subtree: true
                      }
                  );

              }


              /*
               * -----------------------------------------------------
               * START
               * -----------------------------------------------------
               */

              if (
                  document.readyState === "loading"
              ) {

                  document.addEventListener(
                      "DOMContentLoaded",
                      function () {

                          initialize();

                          startObserver();

                      }
                  );

              } else {

                  initialize();

                  startObserver();

              }


              setTimeout(
                  initialize,
                  500
              );

              setTimeout(
                  initialize,
                  1500
              );

              setTimeout(
                  initialize,
                  3000
              );


          })();

          </script>
          """

          # ----------------------------------------------------------
          # INSERT MUSIC PATH
          # ----------------------------------------------------------

          javascript = javascript.replace(
              "__SMRITIAI_MUSIC_SOURCE__",
              music_source
          )

          # ----------------------------------------------------------
          # COMBINE
          # ----------------------------------------------------------

          injection = (
              css +
              "\n" +
              javascript
          )

          # ----------------------------------------------------------
          # CRITICAL FIX:
          #
          # Use lambda as replacement.
          #
          # This prevents Python from interpreting \s, \n, etc.
          # inside the injected JavaScript as regex replacement
          # escapes.
          # ----------------------------------------------------------

          if re.search(
              r"</head\s*>",
              html,
              flags=re.IGNORECASE
          ):

              html = re.sub(
                  r"</head\s*>",
                  lambda match: injection +
                                "\n" +
                                match.group(0),
                  html,
                  count=1,
                  flags=re.IGNORECASE
              )

          else:

              html = (
                  "<head>\n" +
                  injection +
                  "\n</head>\n" +
                  html
              )

          # ----------------------------------------------------------
          # WRITE
          # ----------------------------------------------------------

          html_path.write_text(
              html,
              encoding="utf-8"
          )

          # ----------------------------------------------------------
          # VERIFY
          # ----------------------------------------------------------

          final_html =
              html_path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

          required = [

              "smritiai-final-android-style",
              "smritiai-final-android-script",
              "smritiai-caregiver-icon",
              "smritiai-music-icon",
              "smritiai-logout-icon",
              "smritiai-hidden-rudas-navigation"

          ]


          for item in required:

              if item not in final_html:

                  raise SystemExit(
                      "ERROR: Patch verification failed: "
                      + item
                  )


          print("")
          print("==========================================")
          print("SMRITIAI PATCH SUCCESSFUL")
          print("==========================================")
          print("Original backup:")
          print(backup)
          print("")
          print("Music:")
          print(
              music_source
              if music_source
              else "Not found - original WebAudio preserved"
          )
          print("")
          print("Final HTML size:")
          print(html_path.stat().st_size)
          print("")
          print("All patch markers verified.")
          PY
