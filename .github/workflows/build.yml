name: Build SmritiAI APK - Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. EXTRACT EXISTING SMRITIAI
      # ============================================================
      - name: Extract SmritiAI source
        run: |
          rm -rf smritiai_source
          mkdir -p smritiai_source

          unzip -q "SmritiAI_Source final.zip" -d smritiai_source

          echo "Searching for index.html..."

          INDEX_FILE=$(find smritiai_source -type f -name "index.html" | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html was not found"
            exit 1
          fi

          echo "Using HTML:"
          echo "$INDEX_FILE"

          echo "INDEX_FILE=$INDEX_FILE" >> "$GITHUB_ENV"

      # ============================================================
      # 3. CREATE UI PATCH
      # ============================================================
      - name: Add final SmritiAI UI improvements
        run: |
          python3 <<'PY'
          import os
          import re

          html_file = os.environ["INDEX_FILE"]

          with open(html_file, "r", encoding="utf-8") as f:
              html = f.read()

          # --------------------------------------------------------
          # CSS
          # --------------------------------------------------------
          css = r"""
          <style id="smritiai-final-ui">

          /* ======================================================
             SMRITIAI FINAL UI
             ====================================================== */

          #smritiai-caregiver-button {
              position: fixed;
              right: 18px;
              bottom: 92px;
              width: 58px;
              height: 58px;
              border-radius: 50%;
              border: none;
              background: #2563eb;
              color: white;
              font-size: 27px;
              display: flex;
              align-items: center;
              justify-content: center;
              box-shadow: 0 5px 18px rgba(0,0,0,.22);
              z-index: 999999;
              cursor: pointer;
          }

          #smritiai-caregiver-button:active {
              transform: scale(.94);
          }

          #smritiai-music-button {
              position: fixed;
              right: 18px;
              bottom: 22px;
              width: 58px;
              height: 58px;
              border-radius: 50%;
              border: none;
              background: #7c3aed;
              color: white;
              font-size: 26px;
              display: flex;
              align-items: center;
              justify-content: center;
              box-shadow: 0 5px 18px rgba(0,0,0,.22);
              z-index: 999999;
              cursor: pointer;
          }

          #smritiai-music-panel {
              position: fixed;
              right: 18px;
              bottom: 88px;
              width: 230px;
              padding: 15px;
              border-radius: 18px;
              background: white;
              box-shadow: 0 8px 30px rgba(0,0,0,.25);
              z-index: 999998;
              display: none;
              font-family: sans-serif;
          }

          #smritiai-music-panel.show {
              display: block;
          }

          #smritiai-music-title {
              font-weight: 700;
              margin-bottom: 10px;
              font-size: 15px;
          }

          #smritiai-music-controls {
              display: flex;
              align-items: center;
              gap: 8px;
          }

          #smritiai-music-play {
              border: none;
              border-radius: 12px;
              padding: 10px 15px;
              background: #7c3aed;
              color: white;
              font-weight: 600;
              cursor: pointer;
          }

          #smritiai-music-volume {
              width: 85px;
          }

          /* Hide common persistent RUDAS floating buttons/labels */
          [id*="rudas"][style*="position: fixed"],
          [class*="rudas"][style*="position: fixed"] {
              display: none !important;
          }

          </style>
          """

          # --------------------------------------------------------
          # JavaScript
          # --------------------------------------------------------
          js = r"""
          <script id="smritiai-final-ui-script">
          (() => {

              /*
               * ==================================================
               * SMRITIAI FINAL UI PATCH
               * ==================================================
               */

              const STORAGE_RUDAS = "smritiai_initial_rudas_done";

              function safeText(el) {
                  return (el.innerText || el.textContent || "")
                      .trim()
                      .replace(/\s+/g, " ");
              }

              function findElementByText(words) {
                  const elements = Array.from(
                      document.querySelectorAll(
                          "button, a, div, span, label"
                      )
                  );

                  return elements.find(el => {
                      const text = safeText(el).toLowerCase();

                      if (!text || text.length > 100) return false;

                      return words.some(word =>
                          text.includes(word.toLowerCase())
                      );
                  });
              }

              // ==================================================
              // RUDAS
              // ==================================================

              function hidePersistentRudas() {
                  const elements = Array.from(
                      document.querySelectorAll(
                          "button, a, div, span, label"
                      )
                  );

                  elements.forEach(el => {
                      const text = safeText(el).toLowerCase();

                      if (
                          text.includes("rudas") &&
                          (
                              text.includes("progress") ||
                              text.includes("rudas &") ||
                              text.includes("rudas and")
                          )
                      ) {
                          const rect = el.getBoundingClientRect();

                          /*
                           * Only hide likely floating/persistent
                           * bottom-right RUDAS UI.
                           */
                          if (
                              rect.right > window.innerWidth - 180 &&
                              rect.bottom > window.innerHeight - 180
                          ) {
                              el.style.display = "none";
                          }
                      }
                  });
              }

              function setupFirstRudas() {

                  if (localStorage.getItem(STORAGE_RUDAS) === "done") {
                      hidePersistentRudas();
                      return;
                  }

                  /*
                   * First-time assessment remains accessible through
                   * the existing RUDAS interface.
                   *
                   * We do not automatically start the assessment,
                   * because patient interaction should be intentional.
                   */

                  const observer = new MutationObserver(() => {
                      hidePersistentRudas();
                  });

                  observer.observe(document.body, {
                      childList: true,
                      subtree: true
                  });

                  setInterval(hidePersistentRudas, 1500);
              }

              // ==================================================
              // CAREGIVER BUTTON
              // ==================================================

              function createCaregiverButton() {

                  if (document.getElementById(
                      "smritiai-caregiver-button"
                  )) return;

                  const button = document.createElement("button");

                  button.id = "smritiai-caregiver-button";
                  button.title = "Connect Caregiver";
                  button.setAttribute(
                      "aria-label",
                      "Connect Caregiver"
                  );
                  button.innerHTML = "👩‍⚕️";

                  button.onclick = () => {

                      const target = findElementByText([
                          "connect caregiver",
                          "caregiver",
                          "connect"
                      ]);

                      if (target) {
                          target.click();
                      } else {
                          alert(
                              "Please open the caregiver connection section."
                          );
                      }
                  };

                  document.body.appendChild(button);
              }

              // ==================================================
              // MUSIC PLAYER
              // ==================================================

              function findMusicFile() {

                  /*
                   * The workflow will place the existing audio
                   * inside the Android WebView assets.
                   */

                  const candidates = [
                      "assets/audio/welcome_nostalgia.wav",
                      "./assets/audio/welcome_nostalgia.wav",
                      "audio/welcome_nostalgia.wav",
                      "./audio/welcome_nostalgia.wav",
                      "welcome_nostalgia.wav"
                  ];

                  return candidates[0];
              }

              function createMusicPlayer() {

                  if (document.getElementById(
                      "smritiai-music-button"
                  )) return;

                  const audio = document.createElement("audio");

                  audio.id = "smritiai-nostalgia-audio";
                  audio.loop = true;
                  audio.preload = "auto";
                  audio.volume = 0.55;

                  const source = document.createElement("source");
                  source.src = findMusicFile();
                  source.type = "audio/wav";

                  audio.appendChild(source);
                  document.body.appendChild(audio);

                  const button = document.createElement("button");

                  button.id = "smritiai-music-button";
                  button.title = "Music";
                  button.setAttribute("aria-label", "Music");
                  button.innerHTML = "🎵";

                  const panel = document.createElement("div");

                  panel.id = "smritiai-music-panel";

                  panel.innerHTML = `
                      <div id="smritiai-music-title">
                          🎵 90s Memories
                      </div>

                      <div id="smritiai-music-controls">
                          <button id="smritiai-music-play">
                              ▶ Play
                          </button>

                          <input
                              id="smritiai-music-volume"
                              type="range"
                              min="0"
                              max="1"
                              step="0.05"
                              value="0.55"
                              aria-label="Music volume"
                          />
                      </div>
                  `;

                  document.body.appendChild(panel);
                  document.body.appendChild(button);

                  const playButton =
                      document.getElementById(
                          "smritiai-music-play"
                      );

                  const volume =
                      document.getElementById(
                          "smritiai-music-volume"
                      );

                  button.onclick = () => {
                      panel.classList.toggle("show");
                  };

                  playButton.onclick = async () => {

                      try {

                          if (audio.paused) {

                              await audio.play();

                              playButton.innerText =
                                  "⏸ Pause";

                              button.innerHTML = "🎶";

                          } else {

                              audio.pause();

                              playButton.innerText =
                                  "▶ Play";

                              button.innerHTML = "🎵";
                          }

                      } catch (error) {

                          console.log(
                              "Music playback error:",
                              error
                          );

                          alert(
                              "Tap Play again to start the music."
                          );
                      }
                  };

                  volume.oninput = () => {
                      audio.volume =
                          Number(volume.value);
                  };

                  audio.addEventListener(
                      "play",
                      () => {
                          playButton.innerText =
                              "⏸ Pause";
                          button.innerHTML = "🎶";
                      }
                  );

                  audio.addEventListener(
                      "pause",
                      () => {
                          playButton.innerText =
                              "▶ Play";
                          button.innerHTML = "🎵";
                      }
                  );
              }

              // ==================================================
              // START
              // ==================================================

              function initializeSmritiFinalUI() {

                  if (!document.body) return;

                  createCaregiverButton();
                  createMusicPlayer();
                  setupFirstRudas();
              }

              if (
                  document.readyState === "loading"
              ) {

                  document.addEventListener(
                      "DOMContentLoaded",
                      initializeSmritiFinalUI
                  );

              } else {

                  initializeSmritiFinalUI();
              }

          })();
          </script>
          """

          # Insert immediately before </head>
          if "</head>" in html:
              html = html.replace(
                  "</head>",
                  css + "\n</head>",
                  1
              )
          else:
              html = css + html

          # Insert JS immediately before </body>
          if "</body>" in html:
              html = html.replace(
                  "</body>",
                  js + "\n</body>",
                  1
              )
          else:
              html += js

          with open(html_file, "w", encoding="utf-8") as f:
              f.write(html)

          print("Final SmritiAI UI patch applied.")
          PY

      # ============================================================
      # 4. CREATE ANDROID WEBVIEW PROJECT
      # ============================================================
      - name: Create native Android project
        run: |
          rm -rf android_wrapper

          mkdir -p android_wrapper/app/src/main/java/com/smritiai/app
          mkdir -p android_wrapper/app/src/main/assets/smritiai
          mkdir -p android_wrapper/app/src/main/res/values

          cat > android_wrapper/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SmritiAI"
          include(":app")
          EOF

          cat > android_wrapper/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.9.1" apply false
          }
          EOF

          cat > android_wrapper/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > android_wrapper/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.smritiai.app"

              compileSdk 35

              defaultConfig {
                  applicationId "com.smritiai.app"
                  minSdk 23
                  targetSdk 35

                  versionCode 1
                  versionName "1.0.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > android_wrapper/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.ACCESS_NETWORK_STATE" />

              <uses-permission
                  android:name="android.permission.RECORD_AUDIO" />

              <uses-permission
                  android:name="android.permission.CAMERA" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@android:drawable/ic_menu_info_details"
                  android:label="SmritiAI"
                  android:resizeableActivity="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > android_wrapper/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowActionModeOverlay">
                      true
                  </item>

                  <item name="android:colorAccent">
                      #2563EB
                  </item>

                  <item name="android:navigationBarColor">
                      #FFFFFF
                  </item>

                  <item name="android:statusBarColor">
                      #FFFFFF
                  </item>

                  <item name="android:windowLightStatusBar">
                      true
                  </item>

              </style>

          </resources>
          EOF

      # ============================================================
      # 5. COPY MODIFIED WEB APP
      # ============================================================
      - name: Copy modified SmritiAI web app
        run: |
          WEB_ROOT=$(dirname "$INDEX_FILE")

          cp -R "$WEB_ROOT"/. \
            android_wrapper/app/src/main/assets/smritiai/

          test -f \
            android_wrapper/app/src/main/assets/smritiai/index.html

          echo "Web application copied."

      # ============================================================
      # 6. COPY EXISTING MUSIC INTO WEB ASSETS
      # ============================================================
      - name: Locate and package nostalgia music
        run: |
          mkdir -p \
            android_wrapper/app/src/main/assets/smritiai/assets/audio

          MUSIC_FILE=$(find smritiai_source \
            -type f \
            \( \
              -iname "welcome_nostalgia.wav" \
              -o -iname "welcome_nostalgia.mp3" \
              -o -iname "*nostalgia*.wav" \
              -o -iname "*nostalgia*.mp3" \
            \) \
            | head -n 1)

          if [ -n "$MUSIC_FILE" ]; then

            echo "Found music:"
            echo "$MUSIC_FILE"

            cp "$MUSIC_FILE" \
              android_wrapper/app/src/main/assets/smritiai/assets/audio/welcome_nostalgia.wav

          else

            echo "No nostalgia audio found in ZIP."
            echo "Existing app music will remain untouched."

          fi

      # ============================================================
      # 7. CREATE MAIN ACTIVITY
      # ============================================================
      - name: Create Android WebView activity
        run: |
          cat > android_wrapper/app/src/main/java/com/smritiai/app/MainActivity.java <<'EOF'
          package com.smritiai.app;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestPermissions(
                      new String[] {
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.CAMERA
                      },
                      1001
                  );

                  webView = new WebView(this);

                  WebSettings settings =
                      webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);

                  settings.setMediaPlaybackRequiresUserGesture(false);

                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);

                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);

                  settings.setLoadWithOverviewMode(false);
                  settings.setUseWideViewPort(true);

                  CookieManager.getInstance()
                      .setAcceptCookie(true);

                  CookieManager.getInstance()
                      .setAcceptThirdPartyCookies(
                          webView,
                          true
                      );

                  webView.setWebViewClient(
                      new WebViewClient() {

                          @Override
                          public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request
                          ) {
                              return false;
                          }
                      }
                  );

                  webView.setWebChromeClient(
                      new WebChromeClient() {

                          @Override
                          public void onPermissionRequest(
                              final PermissionRequest request
                          ) {

                              runOnUiThread(() ->
                                  request.grant(
                                      request.getResources()
                                  )
                              );
                          }
                      }
                  );

                  setContentView(webView);

                  webView.loadUrl(
                      "file:///android_asset/smritiai/index.html"
                  );
              }

              @Override
              public void onBackPressed() {

                  if (
                      webView != null &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {

                  if (webView != null) {

                      webView.stopLoading();
                      webView.destroy();
                  }

                  super.onDestroy();
              }
          }
          EOF

      # ============================================================
      # 8. JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 9. GRADLE
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # ============================================================
      # 10. BUILD APK
      # ============================================================
      - name: Build SmritiAI APK
        working-directory: android_wrapper
        run: |
          gradle assembleDebug --no-daemon

      # ============================================================
      # 11. VERIFY
      # ============================================================
      - name: Verify APK
        run: |
          APK="android_wrapper/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo ""
          echo "=========================================="
          echo "     SMRITIAI FINAL APK CREATED"
          echo "=========================================="

          ls -lh "$APK"

      # ============================================================
      # 12. UPLOAD
      # ============================================================
      - name: Upload SmritiAI APK
        uses: actions/upload-artifact@v4
        with:
          name: SmritiAI-APK-Final
          path: android_wrapper/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
