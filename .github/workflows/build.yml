name: Build SmritiAI iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. EXTRACT SMRITIAI SOURCE
      # ============================================================

      - name: Extract SmritiAI source
        shell: bash
        run: |
          set -e

          rm -rf smritiai_source
          mkdir -p smritiai_source

          unzip -q "SmritiAI_Source final.zip" -d smritiai_source

          INDEX_FILE=$(find smritiai_source \
            -type f \
            -name "index.html" \
            | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html was not found."
            exit 1
          fi

          echo "=========================================="
          echo "SmritiAI HTML found:"
          echo "$INDEX_FILE"
          echo "=========================================="

          echo "INDEX_FILE=$INDEX_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 3. CREATE IOS PROJECT
      # ============================================================

      - name: Create iOS application
        shell: bash
        run: |
          set -e

          rm -rf SmritiAI-iOS

          mkdir -p SmritiAI-iOS/SmritiAI.app
          mkdir -p SmritiAI-iOS/Source


      # ============================================================
      # 4. COPY WEB APPLICATION
      # ============================================================

      - name: Copy SmritiAI web application
        shell: bash
        run: |
          set -e

          WEB_ROOT=$(dirname "$INDEX_FILE")

          echo "Copying:"
          echo "$WEB_ROOT"

          cp -R "$WEB_ROOT"/. \
            SmritiAI-iOS/SmritiAI.app/

          test -f \
            SmritiAI-iOS/SmritiAI.app/index.html

          echo "Web application copied successfully."


      # ============================================================
      # 5. PRESERVE MUSIC
      # ============================================================

      - name: Preserve SmritiAI music
        shell: bash
        run: |
          set -e

          MUSIC_FILE=$(find smritiai_source \
            -type f \
            -name "welcome_nostalgia.wav" \
            | head -n 1)

          if [ -n "$MUSIC_FILE" ]; then

            mkdir -p \
              SmritiAI-iOS/SmritiAI.app/assets/audio

            cp "$MUSIC_FILE" \
              SmritiAI-iOS/SmritiAI.app/assets/audio/

            echo "SmritiAI nostalgia music included."

          else

            echo "welcome_nostalgia.wav not found."
            echo "Existing HTML music remains untouched."

          fi


      # ============================================================
      # 6. CREATE APP DELEGATE
      # ============================================================

      - name: Create AppDelegate
        shell: bash
        run: |

          cat > SmritiAI-iOS/Source/AppDelegate.swift <<'EOF'

          import UIKit

          final class AppDelegate:
              UIResponder,
              UIApplicationDelegate {

              var window: UIWindow?

              func application(
                  _ application: UIApplication,
                  didFinishLaunchingWithOptions
                  launchOptions:
                  [UIApplication.LaunchOptionsKey: Any]?
              ) -> Bool {

                  let window =
                      UIWindow(
                          frame: UIScreen.main.bounds
                      )

                  window.rootViewController =
                      ViewController()

                  self.window = window

                  window.makeKeyAndVisible()

                  return true
              }
          }

          EOF


      # ============================================================
      # 7. CREATE WEBVIEW CONTROLLER
      # ============================================================

      - name: Create ViewController
        shell: bash
        run: |

          cat > SmritiAI-iOS/Source/ViewController.swift <<'EOF'

          import UIKit
          import WebKit

          final class ViewController:
              UIViewController,
              WKNavigationDelegate,
              WKUIDelegate,
              WKScriptMessageHandler {

              private var webView: WKWebView!


              override func viewDidLoad() {

                  super.viewDidLoad()

                  view.backgroundColor = .white


                  let configuration =
                      WKWebViewConfiguration()


                  configuration.allowsInlineMediaPlayback =
                      true


                  if #available(iOS 10.0, *) {

                      configuration
                          .mediaTypesRequiringUserActionForPlayback =
                          []

                  }


                  configuration.websiteDataStore =
                      WKWebsiteDataStore.default()


                  configuration.userContentController
                      .add(
                          self,
                          name: "smritiai"
                      )


                  webView =
                      WKWebView(
                          frame: .zero,
                          configuration: configuration
                      )


                  webView.navigationDelegate =
                      self

                  webView.uiDelegate =
                      self

                  webView.translatesAutoresizingMaskIntoConstraints =
                      false


                  view.addSubview(webView)


                  NSLayoutConstraint.activate([

                      webView.leadingAnchor.constraint(
                          equalTo: view.leadingAnchor
                      ),

                      webView.trailingAnchor.constraint(
                          equalTo: view.trailingAnchor
                      ),

                      webView.topAnchor.constraint(
                          equalTo: view.topAnchor
                      ),

                      webView.bottomAnchor.constraint(
                          equalTo: view.bottomAnchor
                      )

                  ])


                  loadSmritiAI()
              }


              private func loadSmritiAI() {

                  guard
                      let url =
                          Bundle.main.url(
                              forResource: "index",
                              withExtension: "html"
                          )
                  else {

                      print(
                          "ERROR: index.html not found"
                      )

                      return
                  }


                  webView.loadFileURL(
                      url,
                      allowingReadAccessTo:
                          Bundle.main.bundleURL
                  )
              }


              func userContentController(
                  _ userContentController:
                      WKUserContentController,
                  didReceive message:
                      WKScriptMessage
              ) {

                  print(
                      "SmritiAI message:",
                      message.body
                  )
              }


              override var
                  preferredStatusBarStyle:
                  UIStatusBarStyle {

                  return .darkContent
              }


              deinit {

                  webView?
                      .configuration
                      .userContentController
                      .removeScriptMessageHandler(
                          forName: "smritiai"
                      )
              }
          }

          EOF


      # ============================================================
      # 8. CREATE MAIN
      # ============================================================

      - name: Create main
        shell: bash
        run: |

          cat > SmritiAI-iOS/Source/main.swift <<'EOF'

          import UIKit

          UIApplicationMain(
              CommandLine.argc,
              CommandLine.unsafeArgv,
              nil,
              NSStringFromClass(AppDelegate.self)
          )

          EOF


      # ============================================================
      # 9. CREATE INFO PLIST
      # ============================================================

      - name: Create Info.plist
        shell: bash
        run: |

          cat > SmritiAI-iOS/SmritiAI.app/Info.plist <<'EOF'

          <?xml version="1.0" encoding="UTF-8"?>

          <!DOCTYPE plist PUBLIC
          "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">

          <dict>

              <key>CFBundleDisplayName</key>
              <string>SmritiAI</string>

              <key>CFBundleName</key>
              <string>SmritiAI</string>

              <key>CFBundleIdentifier</key>
              <string>com.smritiai.app</string>

              <key>CFBundleExecutable</key>
              <string>SmritiAI</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>LSRequiresIPhoneOS</key>
              <true/>

              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>

              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>

              <key>NSCameraUsageDescription</key>
              <string>
                  SmritiAI uses the camera for cognitive assessment activities.
              </string>

              <key>NSMicrophoneUsageDescription</key>
              <string>
                  SmritiAI uses the microphone for voice interaction and speech activities.
              </string>

              <key>NSSpeechRecognitionUsageDescription</key>
              <string>
                  SmritiAI uses speech recognition for voice interaction.
              </string>

          </dict>

          </plist>

          EOF


      # ============================================================
      # 10. CREATE LAUNCH SCREEN
      # ============================================================

      - name: Create launch screen
        shell: bash
        run: |

          cat > SmritiAI-iOS/SmritiAI.app/LaunchScreen.storyboard <<'EOF'

          <?xml version="1.0" encoding="UTF-8"?>

          <document
              type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB"
              version="3.0"
              toolsVersion="21701"
              targetRuntime="iOS.CocoaTouch"
              propertyAccessControl="none"
              useAutolayout="YES"
              useTraitCollections="YES"
              useSafeAreas="YES"
              colorMatched="YES">

              <scenes>

                  <scene sceneID="SmritiAI-Launch">

                      <objects>

                          <viewController
                              id="SmritiAIViewController"
                              sceneMemberID="viewController">

                              <view
                                  key="view"
                                  contentMode="scaleToFill"
                                  id="SmritiAIView">

                                  <rect
                                      key="frame"
                                      x="0.0"
                                      y="0.0"
                                      width="390"
                                      height="844"/>

                                  <autoresizingMask
                                      key="autoresizingMask"
                                      widthSizable="YES"
                                      heightSizable="YES"/>

                                  <color
                                      key="backgroundColor"
                                      white="1.0"
                                      alpha="1.0"
                                      colorSpace="custom"
                                      customColorSpace="genericGamma22GrayColorSpace"/>

                              </view>

                          </viewController>

                          <placeholder
                              placeholderIdentifier="IBFirstResponder"
                              id="FirstResponder"
                              sceneMemberID="firstResponder"/>

                      </objects>

                  </scene>

              </scenes>

          </document>

          EOF


      # ============================================================
      # 11. GET IOS SDK
      # ============================================================

      - name: Get iOS SDK
        shell: bash
        run: |

          set -e

          SDK=$(xcrun \
              --sdk iphoneos \
              --show-sdk-path)

          echo "IOS_SDK=$SDK" >> "$GITHUB_ENV"

          echo "Using SDK:"
          echo "$SDK"


      # ============================================================
      # 12. COMPILE SWIFT
      # ============================================================

      - name: Compile SmritiAI
        shell: bash
        run: |

          set -e

          xcrun swiftc \
            -parse-as-library \
            -sdk "$IOS_SDK" \
            -target arm64-apple-ios15.0 \
            -module-name SmritiAI \
            -framework UIKit \
            -framework WebKit \
            -o SmritiAI-iOS/SmritiAI.app/SmritiAI \
            SmritiAI-iOS/Source/AppDelegate.swift \
            SmritiAI-iOS/Source/ViewController.swift \
            SmritiAI-iOS/Source/main.swift

          echo "=========================================="
          echo "Swift compilation successful"
          echo "=========================================="


      # ============================================================
      # 13. SIGN APP
      # ============================================================

      - name: Sign SmritiAI
        shell: bash
        run: |

          set -e

          xcrun codesign \
            --force \
            --deep \
            --sign - \
            SmritiAI-iOS/SmritiAI.app

          echo "Temporary signing completed."


      # ============================================================
      # 14. VERIFY APP
      # ============================================================

      - name: Verify application
        shell: bash
        run: |

          set -e

          test -f \
            SmritiAI-iOS/SmritiAI.app/SmritiAI

          test -f \
            SmritiAI-iOS/SmritiAI.app/index.html

          test -f \
            SmritiAI-iOS/SmritiAI.app/Info.plist

          echo "=========================================="
          echo "SMRITIAI IOS APP VERIFIED"
          echo "=========================================="

          find SmritiAI-iOS/SmritiAI.app \
            -maxdepth 2 \
            -type f \
            | head -100


      # ============================================================
      # 15. CREATE IPA
      # ============================================================

      - name: Create IPA
        shell: bash
        run: |

          set -e

          rm -rf SmritiAI-iOS/Payload

          mkdir -p SmritiAI-iOS/Payload

          cp -R \
            SmritiAI-iOS/SmritiAI.app \
            SmritiAI-iOS/Payload/SmritiAI.app


          cd SmritiAI-iOS


          zip -qry \
            SmritiAI.ipa \
            Payload


          cd ..


          test -f \
            SmritiAI-iOS/SmritiAI.ipa


          echo "=========================================="
          echo "SMRITIAI IPA CREATED"
          echo "=========================================="

          ls -lh \
            SmritiAI-iOS/SmritiAI.ipa


      # ============================================================
      # 16. UPLOAD IPA
      # ============================================================

      - name: Upload SmritiAI iOS
        uses: actions/upload-artifact@v4

        with:
          name: SmritiAI-iOS
          path: |
            SmritiAI-iOS/SmritiAI.ipa
            SmritiAI-iOS/SmritiAI.app
          retention-days: 30
