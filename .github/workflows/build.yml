      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 19. SETUP GRADLE
      # ============================================================
      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # ============================================================
      # 20. VALIDATE ANDROID FILES
      # ============================================================
      - name: Validate Android project
        shell: bash
        run: |
          set -e

          echo "Checking project..."

          test -f \
            android_wrapper/settings.gradle

          test -f \
            android_wrapper/build.gradle

          test -f \
            android_wrapper/app/build.gradle

          test -f \
            android_wrapper/app/src/main/AndroidManifest.xml

          test -f \
            android_wrapper/app/src/main/res/values/styles.xml

          test -f \
            android_wrapper/app/src/main/java/com/smritiai/app/MainActivity.java

          test -f \
            android_wrapper/app/src/main/assets/smritiai/index.html

          echo "All required files exist."

      # ============================================================
      # 21. VALIDATE XML
      # ============================================================
      - name: Validate XML
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import xml.etree.ElementTree as ET

          files = [
              "android_wrapper/app/src/main/res/values/styles.xml",
              "android_wrapper/app/src/main/AndroidManifest.xml"
          ]

          for filename in files:

              print("Checking:", filename)

              ET.parse(filename)

              print("OK")

          PY

      # ============================================================
      # 22. BUILD APK
      # ============================================================
      - name: Build SmritiAI APK
        working-directory: android_wrapper
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING SMRITIAI ANDROID APP"
          echo "=========================================="

          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 23. VERIFY APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android_wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

              echo "APK NOT FOUND."

              echo
              echo "Available build files:"

              find \
                android_wrapper/app/build \
                -type f \
                2>/dev/null \
                | sort

              exit 1

          fi


          echo
          echo "=========================================="
          echo "APK SUCCESSFULLY CREATED"
          echo "=========================================="

          ls -lh "$APK"

      # ============================================================
      # 24. CREATE FINAL APK
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            android_wrapper/app/build/outputs/apk/debug/app-debug.apk \
            release/SmritiAI.apk

          ls -lh release/SmritiAI.apk

      # ============================================================
      # 25. UPLOAD APK
      # ============================================================
      - name: Upload SmritiAI APK
        uses: actions/upload-artifact@v4
        with:
          name: SmritiAI-Android-v1.0.0
          path: release/SmritiAI.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 26. SUCCESS
      # ============================================================
      - name: Build complete
