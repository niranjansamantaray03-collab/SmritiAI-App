name: Build SmritiAI Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. CHECK SOURCE ZIP
      # ============================================================
      - name: Verify source ZIP
        shell: bash
        run: |
          set -e

          echo "Repository:"
          ls -lah

          test -f "SmritiAI_Source final.zip"

          echo "Source ZIP found:"
          ls -lh "SmritiAI_Source final.zip"

      # ============================================================
      # 3. EXTRACT SOURCE
      # ============================================================
      - name: Extract SmritiAI source
        shell: bash
        run: |
          set -e

          rm -rf smritiai_source
          mkdir -p smritiai_source

          unzip -q "SmritiAI_Source final.zip" \
            -d smritiai_source

          echo "Source extracted."

      # ============================================================
      # 4. FIND INDEX.HTML
      # ============================================================
      - name: Locate index.html
        shell: bash
        run: |
          set -e

          INDEX=$(find smritiai_source \
            -type f \
            -name "index.html" \
            | head -1)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html not found."
            exit 1
          fi

          echo "Using:"
          echo "$INDEX"

          mkdir -p smritiai_web

          cp "$INDEX" \
            smritiai_web/index.html

      # ============================================================
      # 5. BACKUP ORIGINAL HTML
      # ============================================================
      - name: Backup original HTML
        shell: bash
        run: |
          set -e

          cp \
            smritiai_web/index.html \
            smritiai_web/index_original.html

      # ============================================================
      # 6. MODIFY WEB APP FOR ANDROID
      #
      # Left-side controls:
      #   Caregiver
      #   RUDAS
      #   Music
      #   Logout
      #
      # Existing RUDAS assessment is NOT removed.
      # Only the permanent large launcher is hidden.
      # ============================================================
      - name: Add Android controls
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path("smritiai_web/index.html")
          html = path.read_text(encoding="utf-8")

          css = r"""
          <style id="smritiAndroidControlsStyle">

          #smritiAndroidControls {
              position: fixed;
              left: 12px;
              bottom: 24px;
              z-index: 2147483647;

              display: flex;
              flex-direction: column;
              gap: 10px;

              pointer-events: none;
          }

          .smritiAndroidIcon {
              width: 48px;
              height: 48px;

              padding: 0;
              margin: 0;

              border: 0;
              border-radius: 50%;

              display: flex;
              align-items: center;
              justify-content: center;

              background: rgba(15,23,42,.95);
              color: white;

              font-size: 21px;

              box-shadow:
                  0 4px 14px rgba(0,0,0,.28);

              pointer-events: auto;

              cursor: pointer;

              -webkit-tap-highlight-color: transparent;
          }

          .smritiAndroidIcon:active {
              transform: scale(.90);
          }

          #smritiCaregiverIcon {
              background: #2563EB;
          }

          #smritiRudasIcon {
              background: #4F46E5;
          }

          #smritiMusicButton {
              background: #7C3AED;
          }

          #smritiLogoutIcon {
              background: #DC2626;
          }

          /* Hide only the permanent RUDAS launcher */
          #smritiRudasLauncher {
              display: none !important;
          }

          /* Hide old connection floating launcher */
          #connectionFab {
              display: none !important;
          }

          .connection-fab,
          .connect-caregiver-fab,
          .connectCaregiverFab {
              display: none !important;
          }

          @supports (padding-bottom: env(safe-area-inset-bottom)) {

              #smritiAndroidControls {
                  bottom:
                    calc(
                      24px +
                      env(safe-area-inset-bottom)
                    );
              }

          }

          </style>
          """

          controls = r"""
          <div id="smritiAndroidControls">

              <button
                  id="smritiCaregiverIcon"
                  class="smritiAndroidIcon"
                  type="button"
                  aria-label="Connect Caregiver">
                  🔗
              </button>

              <button
                  id="smritiRudasIcon"
                  class="smritiAndroidIcon"
                  type="button"
                  aria-label="RUDAS">
                  🧠
              </button>

              <button
                  id="smritiMusicButton"
                  class="smritiAndroidIcon"
                  type="button"
                  aria-label="Music">
                  🎵
              </button>

              <button
                  id="smritiLogoutIcon"
                  class="smritiAndroidIcon"
                  type="button"
                  aria-label="Logout">
                  🚪
              </button>

          </div>

          <script id="smritiAndroidControlsScript">
          (function(){

              "use strict";

              function caregiver(){

                  try {

                      if(
                          typeof openConnectionPanel ===
                          "function"
                      ){

                          openConnectionPanel();
                          return;

                      }

                      if(typeof toast === "function"){
                          toast(
                              "Caregiver connection unavailable."
                          );
                      }

                  } catch(e){

                      console.error(e);

                  }

              }


              function rudas(){

                  try {

                      const overlay =
                          document.getElementById(
                              "smritiRudasOverlay"
                          );

                      if(!overlay){

                          if(typeof toast === "function"){
                              toast("RUDAS unavailable.");
                          }

                          return;
                      }

                      overlay.style.display = "block";

                      if(
                          typeof refreshAll === "function"
                      ){
                          refreshAll();
                      }

                  } catch(e){

                      console.error(e);

                  }

              }


              function music(){

                  try {

                      if(
                          typeof toggleMusic ===
                          "function"
                      ){

                          toggleMusic();
                          return;

                      }

                      if(
                          typeof musicStart ===
                          "function"
                      ){

                          musicStart();

                          if(typeof toast === "function"){
                              toast("Music ON");
                          }

                          return;

                      }

                  } catch(e){

                      console.error(e);

                  }

              }


              function logout(){

                  try {

                      if(typeof go === "function"){

                          go("logout");
                          return;

                      }

                  } catch(e){

                      console.warn(e);

                  }


                  try {

                      if(
                          typeof db !== "undefined"
                      ){

                          db.active = null;

                          if(
                              typeof saveDB ===
                              "function"
                          ){
                              saveDB();
                          }

                      }

                  } catch(e){

                      console.warn(e);

                  }


                  location.reload();

              }


              function bind(){

                  const caregiverButton =
                      document.getElementById(
                          "smritiCaregiverIcon"
                      );

                  const rudasButton =
                      document.getElementById(
                          "smritiRudasIcon"
                      );

                  const musicButton =
                      document.getElementById(
                          "smritiMusicButton"
                      );

                  const logoutButton =
                      document.getElementById(
                          "smritiLogoutIcon"
                      );


                  if(
                      caregiverButton &&
                      !caregiverButton.dataset.bound
                  ){

                      caregiverButton.dataset.bound =
                          "true";

                      caregiverButton.onclick =
                          caregiver;

                  }


                  if(
                      rudasButton &&
                      !rudasButton.dataset.bound
                  ){

                      rudasButton.dataset.bound =
                          "true";

                      rudasButton.onclick =
                          rudas;

                  }


                  if(
                      musicButton &&
                      !musicButton.dataset.bound
                  ){

                      musicButton.dataset.bound =
                          "true";

                      musicButton.onclick =
                          music;

                  }


                  if(
                      logoutButton &&
                      !logoutButton.dataset.bound
                  ){

                      logoutButton.dataset.bound =
                          "true";

                      logoutButton.onclick =
                          logout;

                  }

              }


              if(
                  document.readyState ===
                  "loading"
              ){

                  document.addEventListener(
                      "DOMContentLoaded",
                      bind
                  );

              } else {

                  bind();

              }


              const observer =
                  new MutationObserver(
                      function(){
                          bind();
                      }
                  );


              observer.observe(
                  document.documentElement,
                  {
                      childList: true,
                      subtree: true
                  }
              );

          })();
          </script>
          """

          if "</head>" in html:
              html = html.replace(
                  "</head>",
                  css + "\n</head>",
                  1
              )
          else:
              html = css + html


          if "</body>" in html:
              html = html.replace(
                  "</body>",
                  controls + "\n</body>",
                  1
              )
          else:
              html += controls


          path.write_text(
              html,
              encoding="utf-8"
          )

          print("Android controls added successfully.")

          PY

      # ============================================================
      # 7. ADD NATIVE VOICE BRIDGE
      # ============================================================
      - name: Add native Android voice bridge
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path("smritiai_web/index.html")
          html = path.read_text(encoding="utf-8")

          bridge = r"""
          <script id="smritiAndroidVoiceBridge">
          (function(){

              "use strict";


              window.SmritiAndroidVoice = {

                  speak: function(text, language){

                      try {

                          if(
                              window.SmritiNative &&
                              typeof
                              window.SmritiNative.speak ===
                              "function"
                          ){

                              window.SmritiNative.speak(
                                  String(text || ""),
                                  String(language || "en")
                              );

                              return true;

                          }

                      } catch(e){

                          console.error(e);

                      }

                      return false;

                  },


                  listen: function(language){

                      try {

                          if(
                              window.SmritiNative &&
                              typeof
                              window.SmritiNative.startListening ===
                              "function"
                          ){

                              window.SmritiNative.startListening(
                                  String(language || "en")
                              );

                              return true;

                          }

                      } catch(e){

                          console.error(e);

                      }

                      return false;

                  }

              };


              window.__smritiSpeechResult =
                  function(text){

                      text =
                          String(text || "");


                      try {

                          if(
                              typeof voiceCommand ===
                              "function"
                          ){

                              voiceCommand(text);
                              return;

                          }


                          if(
                              typeof storyListening !==
                              "undefined" &&
                              storyListening
                          ){

                              if(
                                  typeof storyFinal !==
                                  "undefined"
                              ){

                                  storyFinal +=
                                      (
                                          storyFinal
                                          ? " "
                                          : ""
                                      ) + text;

                              }

                          }

                      } catch(e){

                          console.error(e);

                      }

                  };

          })();
          </script>
          """

          html = html.replace(
              "</body>",
              bridge + "\n</body>",
              1
          )

          path.write_text(
              html,
              encoding="utf-8"
          )

          print("Native voice bridge added.")

          PY

      # ============================================================
      # 8. CREATE ANDROID DIRECTORIES
      # ============================================================
      - name: Create Android directories
        shell: bash
        run: |
          set -e

          rm -rf android_wrapper

          mkdir -p \
            android_wrapper/app/src/main/java/com/smritiai/app

          mkdir -p \
            android_wrapper/app/src/main/res/values

          mkdir -p \
            android_wrapper/app/src/main/assets/smritiai

      # ============================================================
      # 9. SETTINGS.GRADLE
      # ============================================================
      - name: Create settings.gradle
        shell: bash
        run: |
          cat > android_wrapper/settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "SmritiAI"

include(":app")
EOF

      # ============================================================
      # 10. ROOT BUILD.GRADLE
      # IMPORTANT:
      # DO NOT CHANGE THIS SYNTAX.
      # ============================================================
      - name: Create root build.gradle
        shell: bash
        run: |
          cat > android_wrapper/build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.9.1' apply false
}
EOF

      # ============================================================
      # 11. GRADLE PROPERTIES
      # ============================================================
      - name: Create gradle.properties
        shell: bash
        run: |
          cat > android_wrapper/gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
EOF

      # ============================================================
      # 12. APP BUILD.GRADLE
      # ============================================================
      - name: Create app build.gradle
        shell: bash
        run: |
          cat > android_wrapper/app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {

    namespace 'com.smritiai.app'

    compileSdk 35

    defaultConfig {

        applicationId 'com.smritiai.app'

        minSdk 23

        targetSdk 35

        versionCode 1

        versionName '1.0.0'

    }

    buildTypes {

        debug {

            debuggable true

        }

        release {

            minifyEnabled false

            shrinkResources false

            proguardFiles(
                getDefaultProguardFile(
                    'proguard-android-optimize.txt'
                ),
                'proguard-rules.pro'
            )

        }

    }

    compileOptions {

        sourceCompatibility JavaVersion.VERSION_17

        targetCompatibility JavaVersion.VERSION_17

    }

}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'

    implementation 'androidx.webkit:webkit:1.13.0'

}
EOF

          cat > android_wrapper/app/proguard-rules.pro <<'EOF'
# SmritiAI
EOF

      # ============================================================
      # 13. ANDROID THEME
      #
      # IMPORTANT:
      # NO BLANK LINE BEFORE XML DECLARATION.
      # ============================================================
      - name: Create Android theme
        shell: bash
        run: |
          set -e

          cat > android_wrapper/app/src/main/res/values/styles.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>

    <style
        name="AppTheme"
        parent="android:style/Theme.Material.Light.NoActionBar">

        <item name="android:fontFamily">sans</item>

        <item name="android:windowNoTitle">true</item>

        <item name="android:colorAccent">#2563EB</item>

        <item name="android:statusBarColor">#0F172A</item>

        <item name="android:navigationBarColor">#0F172A</item>

        <item name="android:windowLightStatusBar">false</item>

    </style>

</resources>
EOF

      # ============================================================
      # 14. VALIDATE THEME
      # ============================================================
      - name: Verify styles.xml
        shell: bash
        run: |
          set -e

          FIRST_LINE=$(
            head -n 1 \
            android_wrapper/app/src/main/res/values/styles.xml
          )

          echo "First line:"
          echo "$FIRST_LINE"

          test "$FIRST_LINE" = \
            '<?xml version="1.0" encoding="utf-8"?>'

          echo "XML declaration is correct."

      # ============================================================
      # 15. ANDROID MANIFEST
      # ============================================================
      - name: Create Android manifest
        shell: bash
        run: |
          set -e

          cat > android_wrapper/app/src/main/AndroidManifest.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest
    xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-permission
        android:name="android.permission.INTERNET" />

    <uses-permission
        android:name="android.permission.CAMERA" />

    <uses-permission
        android:name="android.permission.RECORD_AUDIO" />

    <uses-permission
        android:name="android.permission.POST_NOTIFICATIONS" />

    <application
        android:allowBackup="true"
        android:usesCleartextTraffic="true"
        android:hardwareAccelerated="true"
        android:label="SmritiAI"
        android:theme="@style/AppTheme"
        android:supportsRtl="true">

        <activity
            android:name=".MainActivity"
            android:screenOrientation="portrait"
            android:exported="true">

            <intent-filter>

                <action
                    android:name="android.intent.action.MAIN" />

                <category
                    android:name="android.intent.category.LAUNCHER" />

            </intent-filter>

        </activity>

    </application>

</manifest>
EOF

      # ============================================================
      # 16. COPY WEB APP INTO ASSETS
      # ============================================================
      - name: Copy SmritiAI into Android assets
        shell: bash
        run: |
          set -e

          cp -R \
            smritiai_web/. \
            android_wrapper/app/src/main/assets/smritiai/

          test -f \
            android_wrapper/app/src/main/assets/smritiai/index.html

          echo "SmritiAI HTML copied."

      # ============================================================
      # 17. MAIN ACTIVITY
      # ============================================================
      - name: Create MainActivity.java
        shell: bash
        run: |
          set -e

          cat > android_wrapper/app/src/main/java/com/smritiai/app/MainActivity.java <<'EOF'
package com.smritiai.app;

import android.Manifest;
import android.app.Activity;
import android.content.Intent;
import android.content.pm.PackageManager;
import android.os.Bundle;
import android.speech.RecognitionListener;
import android.speech.RecognizerIntent;
import android.speech.SpeechRecognizer;
import android.speech.tts.TextToSpeech;
import android.webkit.JavascriptInterface;
import android.webkit.PermissionRequest;
import android.webkit.WebChromeClient;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;

import androidx.core.app.ActivityCompat;
import androidx.core.content.ContextCompat;

import java.util.ArrayList;
import java.util.Locale;


public class MainActivity extends Activity
        implements TextToSpeech.OnInitListener {


    private WebView webView;

    private TextToSpeech tts;

    private SpeechRecognizer recognizer;

    private String speechLanguage = "en";

    private static final int
            PERMISSION_REQUEST = 5001;


    @Override
    protected void onCreate(
            Bundle savedInstanceState
    ) {

        super.onCreate(savedInstanceState);


        getWindow().setStatusBarColor(
                android.graphics.Color.rgb(
                        15,
                        23,
                        42
                )
        );


        getWindow().setNavigationBarColor(
                android.graphics.Color.rgb(
                        15,
                        23,
                        42
                )
        );


        tts =
                new TextToSpeech(
                        this,
                        this
                );


        setupWebView();

        requestPermissions();

    }


    private void setupWebView() {

        webView =
                new WebView(this);


        WebSettings settings =
                webView.getSettings();


        settings.setJavaScriptEnabled(true);

        settings.setDomStorageEnabled(true);

        settings.setDatabaseEnabled(true);

        settings.setAllowFileAccess(true);

        settings.setAllowContentAccess(true);

        settings.setMediaPlaybackRequiresUserGesture(
                false
        );

        settings.setSupportZoom(false);

        settings.setBuiltInZoomControls(false);

        settings.setDisplayZoomControls(false);


        webView.setWebViewClient(
                new WebViewClient()
        );


        webView.setWebChromeClient(
                new WebChromeClient() {

                    @Override
                    public void onPermissionRequest(
                            final PermissionRequest request
                    ) {

                        runOnUiThread(
                                () -> {

                                    request.grant(
                                            request.getResources()
                                    );

                                }
                        );

                    }

                }
        );


        webView.addJavascriptInterface(
                new AndroidBridge(),
                "SmritiNative"
        );


        setContentView(webView);


        webView.loadUrl(
                "file:///android_asset/smritiai/index.html"
        );

    }


    private void requestPermissions() {

        ArrayList<String> permissions =
                new ArrayList<>();


        if(
                ContextCompat.checkSelfPermission(
                        this,
                        Manifest.permission.RECORD_AUDIO
                )
                != PackageManager.PERMISSION_GRANTED
        ) {

            permissions.add(
                    Manifest.permission.RECORD_AUDIO
            );

        }


        if(
                ContextCompat.checkSelfPermission(
                        this,
                        Manifest.permission.CAMERA
                )
                != PackageManager.PERMISSION_GRANTED
        ) {

            permissions.add(
                    Manifest.permission.CAMERA
            );

        }


        if(
                android.os.Build.VERSION.SDK_INT >= 33
        ) {

            if(
                    ContextCompat.checkSelfPermission(
                            this,
                            Manifest.permission.POST_NOTIFICATIONS
                    )
                    != PackageManager.PERMISSION_GRANTED
            ) {

                permissions.add(
                        Manifest.permission.POST_NOTIFICATIONS
                );

            }

        }


        if(!permissions.isEmpty()) {

            ActivityCompat.requestPermissions(
                    this,
                    permissions.toArray(
                            new String[0]
                    ),
                    PERMISSION_REQUEST
            );

        }

    }


    @Override
    public void onInit(int status) {

        if(
                status ==
                TextToSpeech.SUCCESS
        ) {

            tts.setLanguage(
                    Locale.ENGLISH
            );

        }

    }


    private Locale localeFor(
            String language
    ) {

        if(language == null) {
            return Locale.ENGLISH;
        }


        switch(language) {

            case "hi":

                return new Locale(
                        "hi",
                        "IN"
                );


            case "mr":

                return new Locale(
                        "mr",
                        "IN"
                );


            default:

                return Locale.ENGLISH;

        }

    }


    private void speak(
            String text,
            String language
    ) {

        if(tts == null) {
            return;
        }


        if(text == null) {
            return;
        }


        text =
                text.trim();


        if(text.isEmpty()) {
            return;
        }


        tts.setLanguage(
                localeFor(language)
        );


        tts.setSpeechRate(
                0.92f
        );


        tts.setPitch(
                1.0f
        );


        tts.speak(
                text,
                TextToSpeech.QUEUE_FLUSH,
                null,
                "SmritiAI"
        );

    }


    private void startListening(
            String language
    ) {

        speechLanguage =
                language == null
                        ? "en"
                        : language;


        if(
                ContextCompat.checkSelfPermission(
                        this,
                        Manifest.permission.RECORD_AUDIO
                )
                != PackageManager.PERMISSION_GRANTED
        ) {

            ActivityCompat.requestPermissions(
                    this,
                    new String[]{
                            Manifest.permission.RECORD_AUDIO
                    },
                    PERMISSION_REQUEST
            );

            return;

        }


        if(
                !SpeechRecognizer.isRecognitionAvailable(
                        this
                )
        ) {

            sendSpeechResult("");

            return;

        }


        if(recognizer != null) {

            try {

                recognizer.destroy();

            } catch(Exception ignored) {}

        }


        recognizer =
                SpeechRecognizer.createSpeechRecognizer(
                        this
                );


        recognizer.setRecognitionListener(
                new RecognitionListener() {

                    @Override
                    public void onReadyForSpeech(
                            Bundle params
                    ) {}

                    @Override
                    public void onBeginningOfSpeech() {}

                    @Override
                    public void onRmsChanged(
                            float rmsdB
                    ) {}

                    @Override
                    public void onBufferReceived(
                            byte[] buffer
                    ) {}

                    @Override
                    public void onEndOfSpeech() {}

                    @Override
                    public void onPartialResults(
                            Bundle partialResults
                    ) {}

                    @Override
                    public void onEvent(
                            int eventType,
                            Bundle params
                    ) {}


                    @Override
                    public void onError(
                            int error
                    ) {

                        sendSpeechResult("");

                    }


                    @Override
                    public void onResults(
                            Bundle results
                    ) {

                        if(results == null) {

                            sendSpeechResult("");

                            return;

                        }


                        ArrayList<String> matches =
                                results.getStringArrayList(
                                        SpeechRecognizer
                                                .RESULTS_RECOGNITION
                                );


                        if(
                                matches != null &&
                                !matches.isEmpty()
                        ) {

                            sendSpeechResult(
                                    matches.get(0)
                            );

                        } else {

                            sendSpeechResult("");

                        }

                    }

                }
        );


        Intent intent =
                new Intent(
                        RecognizerIntent
                                .ACTION_RECOGNIZE_SPEECH
                );


        intent.putExtra(
                RecognizerIntent
                        .EXTRA_LANGUAGE_MODEL,
                RecognizerIntent
                        .LANGUAGE_MODEL_FREE_FORM
        );


        intent.putExtra(
                RecognizerIntent
                        .EXTRA_LANGUAGE,
                localeFor(
                        speechLanguage
                )
        );


        intent.putExtra(
                RecognizerIntent
                        .EXTRA_MAX_RESULTS,
                1
        );


        recognizer.startListening(
                intent
        );

    }


    private void sendSpeechResult(
            String text
    ) {

        if(webView == null) {
            return;
        }


        final String safe =
                text == null
                        ? ""
                        : text
                            .replace(
                                    "\\",
                                    "\\\\"
                            )
                            .replace(
                                    "'",
                                    "\\'"
                            )
                            .replace(
                                    "\n",
                                    " "
                            )
                            .replace(
                                    "\r",
                                    " "
                            );


        runOnUiThread(
                () -> {

                    webView.evaluateJavascript(
                            "window.__smritiSpeechResult('" +
                            safe +
                            "');",
                            null
                    );

                }
        );

    }


    public class AndroidBridge {

        @JavascriptInterface
        public void speak(
                String text,
                String language
        ) {

            runOnUiThread(
                    () -> MainActivity.this.speak(
                            text,
                            language
                    )
            );

        }


        @JavascriptInterface
        public void startListening(
                String language
        ) {

            runOnUiThread(
                    () -> MainActivity.this.startListening(
                            language
                    )
            );

        }

    }


    @Override
    protected void onDestroy() {

        if(recognizer != null) {

            try {
                recognizer.destroy();
            } catch(Exception ignored) {}

            recognizer = null;

        }


        if(tts != null) {

            try {

                tts.stop();

                tts.shutdown();

            } catch(Exception ignored) {}

            tts = null;

        }


        if(webView != null) {

            webView.stopLoading();

            webView.destroy();

            webView = null;

        }


        super.onDestroy();

    }


    @Override
    public void onBackPressed() {

        if(
                webView != null &&
                webView.canGoBack()
        ) {

            webView.goBack();

        } else {

            super.onBackPressed();

        }

    }

}
