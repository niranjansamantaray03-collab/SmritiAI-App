name: Build SmritiAI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract SmritiAI source
        run: |
          rm -rf smritiai_source
          mkdir -p smritiai_source

          unzip -q "SmritiAI_Source final.zip" -d smritiai_source

          echo "Searching for SmritiAI HTML..."
          find smritiai_source -type f -name "index.html" -print

          INDEX_FILE=$(find smritiai_source -type f -name "index.html" | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html was not found"
            exit 1
          fi

          echo "Using:"
          echo "$INDEX_FILE"

          echo "INDEX_FILE=$INDEX_FILE" >> "$GITHUB_ENV"

      - name: Create native Android project
        run: |
          rm -rf android_wrapper

          mkdir -p android_wrapper/app/src/main/java/com/smritiai/app
          mkdir -p android_wrapper/app/src/main/assets/smritiai

          cat > android_wrapper/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SmritiAI"
          include(":app")
          EOF

          cat > android_wrapper/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.9.1" apply false
          }
          EOF

          cat > android_wrapper/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > android_wrapper/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.smritiai.app"
              compileSdk 35

              defaultConfig {
                  applicationId "com.smritiai.app"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > android_wrapper/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@android:drawable/ic_menu_info_details"
                  android:label="SmritiAI"
                  android:resizeableActivity="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          mkdir -p android_wrapper/app/src/main/res/values

          cat > android_wrapper/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#2563EB</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>

          </resources>
          EOF

      - name: Copy existing SmritiAI web app
        run: |
          WEB_ROOT=$(dirname "$INDEX_FILE")

          echo "Copying existing web application from:"
          echo "$WEB_ROOT"

          cp -R "$WEB_ROOT"/. android_wrapper/app/src/main/assets/smritiai/

          test -f android_wrapper/app/src/main/assets/smritiai/index.html

          echo "SmritiAI web files:"
          find android_wrapper/app/src/main/assets/smritiai -maxdepth 2 -type f | head -100

      - name: Create Android WebView activity
        run: |
          cat > android_wrapper/app/src/main/java/com/smritiai/app/MainActivity.java <<'EOF'
          package com.smritiai.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  requestPermissions(
                      new String[] {
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.CAMERA
                      },
                      1001
                  );

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);

                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);

                  settings.setLoadWithOverviewMode(false);
                  settings.setUseWideViewPort(true);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {
                          return false;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              request.grant(request.getResources());
                          });
                      }
                  });

                  setContentView(webView);

                  webView.loadUrl(
                      "file:///android_asset/smritiai/index.html"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build SmritiAI APK
        working-directory: android_wrapper
        run: |
          gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="android_wrapper/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "======================================"
          echo "SMRITIAI APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload SmritiAI APK
        uses: actions/upload-artifact@v4
        with:
          name: SmritiAI-APK
          path: android_wrapper/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
