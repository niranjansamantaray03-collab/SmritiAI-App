name: Build SmritiAI Final Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. EXTRACT ZIP
      # ============================================================

      - name: Extract SmritiAI source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACTING SMRITIAI"
          echo "=========================================="

          ZIP="SmritiAI_Source final.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found."
            exit 1
          fi

          rm -rf smritiai_source

          mkdir -p smritiai_source

          unzip -q "$ZIP" -d smritiai_source

          echo ""
          echo "ZIP CONTENTS:"
          find smritiai_source -maxdepth 5 -type f | sort | head -300


      # ============================================================
      # 3. FIND THE CORRECT INDEX.HTML
      # ============================================================

      - name: Locate SmritiAI application
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR SMRITIAI HTML"
          echo "=========================================="

          FOUND=""

          while IFS= read -r FILE; do

            echo ""
            echo "Checking:"
            echo "$FILE"

            SIZE=$(wc -c < "$FILE")

            echo "Size: $SIZE bytes"

            # Look for characteristics of the actual SmritiAI app.
            if grep -qiE \
              "SmritiAI|smritiai_v3|Connect Caregiver|RUDAS|caregiver|patient" \
              "$FILE"; then

              echo ">>> SmritiAI candidate found"

              FOUND="$FILE"

              break

            fi

          done < <(
            find smritiai_source \
              -type f \
              -iname "index.html" \
              -print
          )

          if [ -z "$FOUND" ]; then

            echo ""
            echo "ERROR:"
            echo "Could not identify the SmritiAI index.html."

            echo ""
            echo "Available HTML files:"
            find smritiai_source \
              -type f \
              -iname "*.html" \
              -print

            exit 1

          fi

          WEB_ROOT=$(dirname "$FOUND")

          echo ""
          echo "=========================================="
          echo "SMRITIAI APPLICATION FOUND"
          echo "=========================================="

          echo "INDEX:"
          echo "$FOUND"

          echo ""
          echo "WEB ROOT:"
          echo "$WEB_ROOT"

          echo "INDEX_FILE=$FOUND" >> "$GITHUB_ENV"
          echo "WEB_ROOT=$WEB_ROOT" >> "$GITHUB_ENV"


      # ============================================================
      # 4. VERIFY ORIGINAL APPLICATION
      # ============================================================

      - name: Verify original SmritiAI
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING ORIGINAL APPLICATION"
          echo "=========================================="

          test -f "$INDEX_FILE"

          echo ""
          echo "HTML SIZE:"
          wc -c "$INDEX_FILE"

          echo ""
          echo "SmritiAI references:"
          grep -oi "SmritiAI" "$INDEX_FILE" | head -20 || true

          echo ""
          echo "RUDAS references:"
          grep -oi "RUDAS" "$INDEX_FILE" | head -20 || true

          echo ""
          echo "Caregiver references:"
          grep -oi "caregiver" "$INDEX_FILE" | head -20 || true

          echo ""
          echo "Patient references:"
          grep -oi "patient" "$INDEX_FILE" | head -20 || true


      # ============================================================
      # 5. CREATE ANDROID PROJECT
      # ============================================================

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf android_wrapper

          mkdir -p \
            android_wrapper/app/src/main/java/com/smritiai/app

          mkdir -p \
            android_wrapper/app/src/main/assets/smritiai

          mkdir -p \
            android_wrapper/app/src/main/res/values


          # --------------------------------------------------------
          # settings.gradle
          # --------------------------------------------------------

          cat > android_wrapper/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SmritiAI"

          include(":app")
          EOF


          # --------------------------------------------------------
          # build.gradle
          # --------------------------------------------------------

          cat > android_wrapper/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.9.1" apply false
          }
          EOF


          # --------------------------------------------------------
          # gradle.properties
          # --------------------------------------------------------

          cat > android_wrapper/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF


          # --------------------------------------------------------
          # app/build.gradle
          # --------------------------------------------------------

          cat > android_wrapper/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.smritiai.app"

              compileSdk 35

              defaultConfig {
                  applicationId "com.smritiai.app"

                  minSdk 23

                  targetSdk 35

                  versionCode 1

                  versionName "1.0.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF


          # --------------------------------------------------------
          # Manifest
          # --------------------------------------------------------

          cat > android_wrapper/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.ACCESS_NETWORK_STATE" />

              <uses-permission
                  android:name="android.permission.CAMERA" />

              <uses-permission
                  android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="SmritiAI"
                  android:resizeableActivity="true"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


          # --------------------------------------------------------
          # Theme
          # --------------------------------------------------------

          cat > android_wrapper/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">#2563EB</item>

                  <item name="android:navigationBarColor">#FFFFFF</item>

                  <item name="android:statusBarColor">#FFFFFF</item>

                  <item name="android:windowLightStatusBar">true</item>

                  <item name="android:windowNoTitle">true</item>

              </style>

          </resources>
          EOF


      # ============================================================
      # 6. COPY THE ENTIRE WEB APP
      # ============================================================

      - name: Copy complete SmritiAI web application
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "COPYING COMPLETE SMRITIAI APPLICATION"
          echo "=========================================="

          rm -rf \
            android_wrapper/app/src/main/assets/smritiai/*

          cp -R "$WEB_ROOT"/. \
            android_wrapper/app/src/main/assets/smritiai/


          # --------------------------------------------------------
          # Verify
          # --------------------------------------------------------

          test -f \
            android_wrapper/app/src/main/assets/smritiai/index.html


          echo ""
          echo "Copied files:"
          find \
            android_wrapper/app/src/main/assets/smritiai \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -300


          echo ""
          echo "Final index.html:"
          wc -c \
            android_wrapper/app/src/main/assets/smritiai/index.html


      # ============================================================
      # 7. DO NOT MODIFY THE APP YET
      #
      # First build the ORIGINAL application inside Android.
      #
      # This guarantees that we are not breaking the original UI.
      # ============================================================

      - name: Verify original HTML inside Android assets
        shell: bash
        run: |
          set -e

          HTML="android_wrapper/app/src/main/assets/smritiai/index.html"

          echo "=========================================="
          echo "FINAL HTML VERIFICATION"
          echo "=========================================="

          test -f "$HTML"

          if ! grep -qiE \
            "SmritiAI|smritiai_v3|Connect Caregiver|RUDAS" \
            "$HTML"; then

            echo "ERROR: This does not appear to be the SmritiAI app."

            exit 1

          fi

          echo ""
          echo "SmritiAI HTML confirmed."


      # ============================================================
      # 8. CREATE WEBVIEW ACTIVITY
      # ============================================================

      - name: Create Android WebView
        shell: bash
        run: |
          set -e

          cat > android_wrapper/app/src/main/java/com/smritiai/app/MainActivity.java <<'EOF'
          package com.smritiai.app;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  requestPermissions(
                      new String[] {
                          Manifest.permission.CAMERA,
                          Manifest.permission.RECORD_AUDIO
                      },
                      1001
                  );

                  webView = new WebView(this);

                  WebSettings settings =
                      webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  settings.setMediaPlaybackRequiresUserGesture(
                      false
                  );

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setAllowFileAccessFromFileURLs(true);

                  settings.setAllowUniversalAccessFromFileURLs(true);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setSupportZoom(false);

                  settings.setLoadWithOverviewMode(false);

                  settings.setUseWideViewPort(true);

                  CookieManager cookies =
                      CookieManager.getInstance();

                  cookies.setAcceptCookie(true);

                  cookies.setAcceptThirdPartyCookies(
                      webView,
                      true
                  );

                  webView.setWebViewClient(
                      new WebViewClient() {

                          @Override
                          public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request
                          ) {

                              return false;
                          }

                      }
                  );

                  webView.setWebChromeClient(
                      new WebChromeClient() {

                          @Override
                          public void onPermissionRequest(
                              final PermissionRequest request
                          ) {

                              runOnUiThread(
                                  () -> request.grant(
                                      request.getResources()
                                  )
                              );

                          }

                      }
                  );

                  setContentView(webView);

                  webView.loadUrl(
                      "file:///android_asset/smritiai/index.html"
                  );

              }


              @Override
              public void onBackPressed() {

                  if (
                      webView != null &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();

                  }

              }


              @Override
              protected void onDestroy() {

                  if (webView != null) {

                      webView.stopLoading();

                      webView.destroy();

                      webView = null;

                  }

                  super.onDestroy();

              }

          }
          EOF


      # ============================================================
      # 9. JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 10. GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"


      # ============================================================
      # 11. BUILD
      # ============================================================

      - name: Build SmritiAI APK
        working-directory: android_wrapper
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING SMRITIAI"
          echo "=========================================="

          gradle assembleDebug --no-daemon

          echo ""
          echo "BUILD FINISHED"


      # ============================================================
      # 12. VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android_wrapper/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo ""
          echo "=========================================="
          echo "SMRITIAI APK SUCCESS"
          echo "=========================================="

          ls -lh "$APK"

          sha256sum "$APK"


      # ============================================================
      # 13. UPLOAD
      # ============================================================

      - name: Upload SmritiAI APK
        uses: actions/upload-artifact@v4
        with:
          name: SmritiAI-Final-APK
          path: android_wrapper/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
