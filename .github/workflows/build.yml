name: SmritiAI - Full Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. CHECK SOURCE ZIP
      # ============================================================

      - name: Verify SmritiAI source
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SMRITIAI SOURCE CHECK"
          echo "======================================"

          if [ ! -f "SmritiAI_Source final.zip" ]; then
            echo "ERROR: SmritiAI_Source final.zip not found."
            exit 1
          fi

          ls -lh "SmritiAI_Source final.zip"


      # ============================================================
      # 3. EXTRACT SOURCE
      # ============================================================

      - name: Extract SmritiAI source
        shell: bash
        run: |
          set -e

          rm -rf smritiai_source
          mkdir -p smritiai_source

          unzip -q "SmritiAI_Source final.zip" \
            -d smritiai_source

          echo "Searching for index.html..."

          INDEX_FILE=$(
            find smritiai_source \
              -type f \
              -name "index.html" \
              | head -n 1
          )

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html was not found."
            exit 1
          fi

          echo "Using:"
          echo "$INDEX_FILE"

          echo "INDEX_FILE=$INDEX_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 4. PREPARE WEB APP
      # ============================================================

      - name: Prepare SmritiAI web application
        shell: bash
        run: |
          set -e

          rm -rf smritiai_web
          mkdir -p smritiai_web

          WEB_ROOT=$(dirname "$INDEX_FILE")

          cp -R "$WEB_ROOT"/. smritiai_web/

          test -f smritiai_web/index.html

          echo "HTML size:"
          wc -c smritiai_web/index.html


      # ============================================================
      # 5. ADD MOBILE CONTROLS + ANDROID VOICE
      # ============================================================

      - name: Upgrade SmritiAI mobile interface
        shell: bash
        run: |

          set -e

          python3 <<'PY'

          from pathlib import Path

          path = Path("smritiai_web/index.html")

          html = path.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          print("Original HTML size:", len(html))


          # ========================================================
          # CSS
          # ========================================================

          css = r"""

          /* ========================================================
             SMRITIAI ANDROID CONTROLS
             ======================================================== */

          #smritiRudasLauncher {
              display: none !important;
              visibility: hidden !important;
              pointer-events: none !important;
          }


          #connectionFab {
              display: none !important;
              visibility: hidden !important;
              pointer-events: none !important;
          }


          #smritiCaregiverIcon,
          #smritiRudasIcon,
          #smritiMusicButton,
          #smritiLogoutIcon {

              position: fixed;

              left: 12px;

              width: 48px;

              height: 48px;

              padding: 0;

              margin: 0;

              border: none;

              border-radius: 50%;

              display: flex;

              align-items: center;

              justify-content: center;

              color: white;

              font-size: 21px;

              line-height: 48px;

              text-align: center;

              cursor: pointer;

              z-index: 999990;

              box-shadow:
                  0 8px 25px rgba(0,0,0,.22);

              -webkit-tap-highlight-color:
                  transparent;

              user-select: none;

              transition:
                  transform .15s ease,
                  box-shadow .15s ease;

          }


          #smritiCaregiverIcon:active,
          #smritiRudasIcon:active,
          #smritiMusicButton:active,
          #smritiLogoutIcon:active {

              transform: scale(.90);

          }


          /* CAREGIVER */

          #smritiCaregiverIcon {

              bottom: 222px;

              background: #2563eb;

          }


          /* RUDAS */

          #smritiRudasIcon {

              bottom: 166px;

              background: #4f46e5;

          }


          /* MUSIC */

          #smritiMusicButton {

              bottom: 110px;

              background: #0f766e;

          }


          /* LOGOUT */

          #smritiLogoutIcon {

              bottom: 54px;

              background: #dc2626;

          }


          @supports(padding: env(safe-area-inset-bottom)) {

              #smritiCaregiverIcon {

                  bottom:
                      calc(
                          222px +
                          env(safe-area-inset-bottom)
                      );

              }

              #smritiRudasIcon {

                  bottom:
                      calc(
                          166px +
                          env(safe-area-inset-bottom)
                      );

              }

              #smritiMusicButton {

                  bottom:
                      calc(
                          110px +
                          env(safe-area-inset-bottom)
                      );

              }

              #smritiLogoutIcon {

                  bottom:
                      calc(
                          54px +
                          env(safe-area-inset-bottom)
                      );

              }

          }


          #smritiRudasOverlay {

              z-index:
                  999999 !important;

          }


          html,
          body {

              overscroll-behavior-y:
                  none;

              -webkit-text-size-adjust:
                  100%;

          }


          button {

              -webkit-tap-highlight-color:
                  transparent;

          }


          @media(max-width:600px) {

              #smritiRudasPanel {

                  width:
                      100% !important;

                  max-width:
                      100% !important;

                  min-height:
                      100vh !important;

                  margin:
                      0 !important;

                  border-radius:
                      0 !important;

              }

              #smritiRudasOverlay {

                  padding:
                      0 !important;

              }

          }

          """


          if "</head>" in html:

              html = html.replace(
                  "</head>",
                  "<style id=\"smritiai-android-ui\">" +
                  css +
                  "</style></head>",
                  1
              )

          else:

              html = css + html


          # ========================================================
          # JAVASCRIPT
          # ========================================================

          js = r"""

          <script id="smritiai-android-controller">

          (function(){

              "use strict";


              /* ====================================================
                 REMOVE OLD CONTROLS
                 ==================================================== */

              function removeOldControls(){

                  [
                      "smritiCaregiverIcon",
                      "smritiRudasIcon",
                      "smritiMusicButton",
                      "smritiLogoutIcon"
                  ].forEach(function(id){

                      var old =
                          document.getElementById(id);

                      if(old){

                          old.remove();

                      }

                  });


                  var oldConnection =
                      document.getElementById(
                          "connectionFab"
                      );

                  if(oldConnection){

                      oldConnection.remove();

                  }


                  var oldRudas =
                      document.getElementById(
                          "smritiRudasLauncher"
                      );

                  if(oldRudas){

                      oldRudas.style.display =
                          "none";

                      oldRudas.style.visibility =
                          "hidden";

                      oldRudas.style.pointerEvents =
                          "none";

                  }

              }


              /* ====================================================
                 BUTTON CREATOR
                 ==================================================== */

              function makeButton(
                  id,
                  icon,
                  title,
                  handler
              ){

                  if(
                      document.getElementById(id)
                  ){

                      return;

                  }


                  var button =
                      document.createElement(
                          "button"
                      );


                  button.id =
                      id;


                  button.type =
                      "button";


                  button.innerHTML =
                      icon;


                  button.title =
                      title;


                  button.setAttribute(
                      "aria-label",
                      title
                  );


                  button.onclick =
                      function(event){

                          event.preventDefault();

                          event.stopPropagation();

                          try {

                              handler();

                          } catch(error) {

                              console.error(
                                  "SmritiAI control error:",
                                  error
                              );

                          }

                      };


                  document.body.appendChild(
                      button
                  );

              }


              /* ====================================================
                 CREATE CONTROLS
                 ==================================================== */

              function createControls(){

                  if(!document.body){

                      return;

                  }


                  /* Remove only old original buttons */

                  var oldConnection =
                      document.getElementById(
                          "connectionFab"
                      );

                  if(oldConnection){

                      oldConnection.remove();

                  }


                  var oldRudas =
                      document.getElementById(
                          "smritiRudasLauncher"
                      );

                  if(oldRudas){

                      oldRudas.style.display =
                          "none";

                      oldRudas.style.visibility =
                          "hidden";

                      oldRudas.style.pointerEvents =
                          "none";

                  }


                  /* =================================================
                     CAREGIVER
                     ================================================= */

                  makeButton(

                      "smritiCaregiverIcon",

                      "🔗",

                      "Connect Caregiver",

                      function(){

                          if(
                              typeof window.openConnectionPanel ===
                              "function"
                          ){

                              window.openConnectionPanel();

                          } else {

                              alert(
                                  "Caregiver connection is unavailable."
                              );

                          }

                      }

                  );


                  /* =================================================
                     RUDAS
                     ================================================= */

                  makeButton(

                      "smritiRudasIcon",

                      "🧠",

                      "RUDAS Assessment",

                      function(){

                          var overlay =
                              document.getElementById(
                                  "smritiRudasOverlay"
                              );


                          if(overlay){

                              overlay.style.display =
                                  "block";


                              if(
                                  typeof window.refreshAll ===
                                  "function"
                              ){

                                  try {

                                      window.refreshAll();

                                  } catch(error) {}

                              }

                              return;

                          }


                          var launcher =
                              document.getElementById(
                                  "smritiRudasLauncher"
                              );


                          if(launcher){

                              launcher.style.display =
                                  "block";

                              launcher.click();

                              launcher.style.display =
                                  "none";

                          } else {

                              alert(
                                  "RUDAS assessment is unavailable."
                              );

                          }

                      }

                  );


                  /* =================================================
                     MUSIC
                     ================================================= */

                  makeButton(

                      "smritiMusicButton",

                      "🎵",

                      "Music",

                      function(){

                          if(
                              typeof window.toggleMusic ===
                              "function"
                          ){

                              window.toggleMusic();

                          } else {

                              alert(
                                  "Music is unavailable."
                              );

                          }

                      }

                  );


                  /* =================================================
                     LOGOUT
                     ================================================= */

                  makeButton(

                      "smritiLogoutIcon",

                      "🚪",

                      "Logout",

                      function(){

                          /* Try original app logout */

                          if(
                              typeof window.go ===
                              "function"
                          ){

                              try {

                                  window.go(
                                      "logout"
                                  );

                                  return;

                              } catch(error) {

                                  console.error(
                                      error
                                  );

                              }

                          }


                          /* Fallback */

                          try {

                              if(
                                  typeof window.db !==
                                  "undefined"
                              ){

                                  window.db.active =
                                      null;


                                  if(
                                      typeof window.saveDB ===
                                      "function"
                                  ){

                                      window.saveDB();

                                  }

                              }

                          } catch(error) {

                              console.error(
                                  error
                              );

                          }


                          try {

                              localStorage.removeItem(
                                  "smritiai_session"
                              );

                          } catch(error) {}


                          location.reload();

                      }

                  );

              }


              /* ====================================================
                 INSTALL
                 ==================================================== */

              function install(){

                  if(
                      document.body
                  ){

                      createControls();

                  }

              }


              /* ====================================================
                 BOOT
                 ==================================================== */

              function boot(){

                  install();

                  setTimeout(
                      install,
                      500
                  );

                  setTimeout(
                      install,
                      1500
                  );

                  setTimeout(
                      install,
                      3000
                  );

              }


              if(
                  document.readyState ===
                  "loading"
              ){

                  document.addEventListener(
                      "DOMContentLoaded",
                      boot
                  );

              } else {

                  boot();

              }


              /* ====================================================
                 APP RENDER PROTECTION
                 ==================================================== */

              var observer =
                  new MutationObserver(
                      function(){

                          var missing =

                              !document.getElementById(
                                  "smritiCaregiverIcon"
                              ) ||

                              !document.getElementById(
                                  "smritiRudasIcon"
                              ) ||

                              !document.getElementById(
                                  "smritiMusicButton"
                              ) ||

                              !document.getElementById(
                                  "smritiLogoutIcon"
                              );


                          if(missing){

                              createControls();

                          }


                          var oldConnection =
                              document.getElementById(
                                  "connectionFab"
                              );


                          if(oldConnection){

                              oldConnection.remove();

                          }


                          var oldRudas =
                              document.getElementById(
                                  "smritiRudasLauncher"
                              );


                          if(oldRudas){

                              oldRudas.style.display =
                                  "none";

                              oldRudas.style.visibility =
                                  "hidden";

                              oldRudas.style.pointerEvents =
                                  "none";

                          }

                      }
                  );


              try {

                  observer.observe(
                      document.documentElement,
                      {
                          childList: true,
                          subtree: true
                      }
                  );

              } catch(error) {}


              /* ====================================================
                 NATIVE ANDROID TTS
                 ==================================================== */

              var originalSpeak =
                  window.speak;


              window.speak =
                  function(text){

                      try {

                          if(
                              window.SmritiNative &&
                              typeof window.SmritiNative.speak ===
                              "function"
                          ){

                              var language =
                                  "en-IN";


                              try {

                                  if(
                                      typeof window.db !==
                                      "undefined" &&
                                      window.db.active &&
                                      window.db.active.language
                                  ){

                                      if(
                                          window.db.active.language
                                          === "hi"
                                      ){

                                          language =
                                              "hi-IN";

                                      } else if(
                                          window.db.active.language
                                          === "mr"
                                      ){

                                          language =
                                              "mr-IN";

                                      }

                                  }

                              } catch(error) {}


                              window.SmritiNative.speak(
                                  String(
                                      text || ""
                                  ),
                                  language
                              );

                              return;

                          }

                      } catch(error) {

                          console.error(
                              error
                          );

                      }


                      if(
                          typeof originalSpeak ===
                          "function"
                      ){

                          originalSpeak(
                              text
                          );

                      }

                  };


              /* ====================================================
                 NATIVE ANDROID SPEECH
                 ==================================================== */

              window.smritiAndroidVoice =
                  function(){

                      try {

                          if(
                              window.SmritiNative &&
                              typeof window.SmritiNative.startListening ===
                              "function"
                          ){

                              var language =
                                  "en-IN";


                              try {

                                  if(
                                      typeof window.db !==
                                      "undefined" &&
                                      window.db.active &&
                                      window.db.active.language
                                  ){

                                      if(
                                          window.db.active.language
                                          === "hi"
                                      ){

                                          language =
                                              "hi-IN";

                                      } else if(
                                          window.db.active.language
                                          === "mr"
                                      ){

                                          language =
                                              "mr-IN";

                                      }

                                  }

                              } catch(error) {}


                              window.SmritiNative.startListening(
                                  language
                              );


                              return true;

                          }

                      } catch(error) {

                          console.error(
                              error
                          );

                      }


                      return false;

                  };


              /* ====================================================
                 SPEECH RESULT
                 ==================================================== */

              window.__smritiSpeechResult =
                  function(text){

                      var value =
                          String(
                              text || ""
                          )
                          .trim()
                          .toLowerCase();


                      if(!value){

                          return;

                      }


                      console.log(
                          "SmritiAI voice:",
                          value
                      );


                      /* Games */

                      if(
                          value.includes("game") ||
                          value.includes("games") ||
                          value.includes("गेम")
                      ){

                          if(
                              typeof window.go ===
                              "function"
                          ){

                              window.go(
                                  "games"
                              );

                              return;

                          }

                      }


                      /* Stories */

                      if(
                          value.includes("story") ||
                          value.includes("stories") ||
                          value.includes("कहानी")
                      ){

                          if(
                              typeof window.go ===
                              "function"
                          ){

                              window.go(
                                  "stories"
                              );

                              return;

                          }

                      }


                      /* Memory */

                      if(
                          value.includes("memory") ||
                          value.includes("album") ||
                          value.includes("याद")
                      ){

                          if(
                              typeof window.go ===
                              "function"
                          ){

                              window.go(
                                  "album"
                              );

                              return;

                          }

                      }


                      /* Reminders */

                      if(
                          value.includes("reminder") ||
                          value.includes("reminders") ||
                          value.includes("याद दिल")
                      ){

                          if(
                              typeof window.go ===
                              "function"
                          ){

                              window.go(
                                  "reminders"
                              );

                              return;

                          }

                      }


                      /* Summary */

                      if(
                          value.includes("summary")
                      ){

                          if(
                              typeof window.go ===
                              "function"
                          ){

                              window.go(
                                  "summary"
                              );

                              return;

                          }

                      }


                      /* Generic response */

                      if(
                          typeof window.speak ===
                          "function"
                      ){

                          window.speak(
                              "I heard " +
                              value
                          );

                      }

                  };


              /* ====================================================
                 VOICE COMMAND
                 ==================================================== */

              var originalVoiceCommand =
                  window.voiceCommand;


              window.voiceCommand =
                  function(){

                      if(
                          typeof window.smritiAndroidVoice ===
                          "function"
                      ){

                          if(
                              window.smritiAndroidVoice()
                          ){

                              return;

                          }

                      }


                      if(
                          typeof originalVoiceCommand ===
                          "function"
                      ){

                          originalVoiceCommand();

                      }

                  };


          })();

          </script>

          """


          if "</body>" in html:

              html = html.replace(
                  "</body>",
                  js + "</body>",
                  1
              )

          else:

              html += js


          path.write_text(
              html,
              encoding="utf-8"
          )


          print(
              "Updated HTML size:",
              len(html)
          )

          PY


      # ============================================================
      # 6. VERIFY HTML
      # ============================================================

      - name: Verify SmritiAI application
        shell: bash
        run: |

          set -e

          HTML="smritiai_web/index.html"

          test -f "$HTML"


          echo "Checking RUDAS..."

          grep -q \
            "SMRITI_RUDAS_BACKBONE_V2" \
            "$HTML"


          echo "Checking caregiver..."

          grep -q \
            "openConnectionPanel" \
            "$HTML"


          echo "Checking controls..."

          grep -q \
            "smritiCaregiverIcon" \
            "$HTML"

          grep -q \
            "smritiRudasIcon" \
            "$HTML"

          grep -q \
            "smritiMusicButton" \
            "$HTML"

          grep -q \
            "smritiLogoutIcon" \
            "$HTML"


          echo "Checking Android voice..."

          grep -q \
            "SmritiNative" \
            "$HTML"


          echo ""
          echo "======================================"
          echo "SMRITIAI HTML VERIFIED"
          echo "======================================"


      # ============================================================
      # 7. CREATE ANDROID PROJECT
      # ============================================================

      - name: Create Android project
        shell: bash
        run: |

          set -e

          rm -rf android_wrapper


          mkdir -p \
            android_wrapper/app/src/main/java/com/smritiai/app


          mkdir -p \
            android_wrapper/app/src/main/res/values


          mkdir -p \
            android_wrapper/app/src/main/assets/smritiai


          # --------------------------------------------------------
          # SETTINGS
          # --------------------------------------------------------

          cat > android_wrapper/settings.gradle <<'EOF'

          pluginManagement {

              repositories {

                  google()

                  mavenCentral()

                  gradlePluginPortal()

              }

          }


          dependencyResolutionManagement {

              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {

                  google()

                  mavenCentral()

              }

          }


          rootProject.name =
              "SmritiAIAndroid"


          include(":app")

          EOF


          # --------------------------------------------------------
          # ROOT BUILD
          # IMPORTANT: CORRECT GRADLE SYNTAX
          # --------------------------------------------------------

          cat > android_wrapper/build.gradle <<'EOF'

          plugins {
              id 'com.android.application' version '8.9.1' apply false
          }

          EOF


          # --------------------------------------------------------
          # GRADLE PROPERTIES
          # --------------------------------------------------------

          cat > android_wrapper/gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

          android.useAndroidX=true

          android.nonTransitiveRClass=true

          android.enableJetifier=true

          EOF


          # --------------------------------------------------------
          # APP BUILD
          # --------------------------------------------------------

          cat > android_wrapper/app/build.gradle <<'EOF'

          plugins {
              id 'com.android.application'
          }


          android {

              namespace 'com.smritiai.app'

              compileSdk 35


              defaultConfig {

                  applicationId 'com.smritiai.app'

                  minSdk 23

                  targetSdk 35

                  versionCode 1

                  versionName '1.0.0'

              }


              buildTypes {

                  debug {

                      debuggable true

                      minifyEnabled false

                  }


                  release {

                      minifyEnabled false

                      shrinkResources false

                  }

              }

          }

          EOF


      # ============================================================
      # 8. ANDROID THEME
      # ============================================================

      - name: Create Android theme
        shell: bash
        run: |

          cat > \
          android_wrapper/app/src/main/res/values/styles.xml \
          <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:windowNoTitle">
                      true
                  </item>

                  <item name="android:colorAccent">
                      #2563EB
                  </item>

                  <item name="android:statusBarColor">
                      #0F172A
                  </item>

                  <item name="android:navigationBarColor">
                      #0F172A
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

              </style>

          </resources>

          EOF


      # ============================================================
      # 9. ANDROID MANIFEST
      # ============================================================

      - name: Create Android manifest
        shell: bash
        run: |

          cat > \
          android_wrapper/app/src/main/AndroidManifest.xml \
          <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">


              <uses-permission
                  android:name="android.permission.INTERNET" />


              <uses-permission
                  android:name="android.permission.CAMERA" />


              <uses-permission
                  android:name="android.permission.RECORD_AUDIO" />


              <application

                  android:allowBackup="true"

                  android:hardwareAccelerated="true"

                  android:usesCleartextTraffic="true"

                  android:label="SmritiAI"

                  android:theme="@style/AppTheme">


                  <activity

                      android:name=".MainActivity"

                      android:screenOrientation="portrait"

                      android:exported="true">


                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />


                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>


                  </activity>

              </application>


          </manifest>

          EOF


      # ============================================================
      # 10. COPY WEB APP
      # ============================================================

      - name: Copy SmritiAI into Android assets
        shell: bash
        run: |

          set -e

          cp -R \
            smritiai_web/. \
            android_wrapper/app/src/main/assets/smritiai/


          test -f \
            android_wrapper/app/src/main/assets/smritiai/index.html


          echo "SmritiAI web application copied."


      # ============================================================
      # 11. CREATE NATIVE ANDROID BRIDGE
      # ============================================================

      - name: Create native Android voice bridge
        shell: bash
        run: |

          cat > \
          android_wrapper/app/src/main/java/com/smritiai/app/MainActivity.java \
          <<'EOF'

          package com.smritiai.app;


          import android.Manifest;

          import android.app.Activity;

          import android.content.Intent;

          import android.content.pm.PackageManager;

          import android.os.Bundle;

          import android.speech.RecognitionListener;

          import android.speech.RecognizerIntent;

          import android.speech.SpeechRecognizer;

          import android.speech.tts.TextToSpeech;

          import android.webkit.JavascriptInterface;

          import android.webkit.PermissionRequest;

          import android.webkit.WebChromeClient;

          import android.webkit.WebSettings;

          import android.webkit.WebView;

          import android.webkit.WebViewClient;


          import java.util.ArrayList;

          import java.util.Locale;


          public class MainActivity
              extends Activity {


              private WebView webView;

              private TextToSpeech tts;

              private SpeechRecognizer speechRecognizer;


              private static final int
                  PERMISSION_REQUEST = 1001;


              @Override

              protected void onCreate(
                  Bundle savedInstanceState
              ) {

                  super.onCreate(
                      savedInstanceState
                  );


                  initializeTTS();

                  initializeWebView();

                  requestPermissionsIfNeeded();

              }


              /* ====================================================
                 WEBVIEW
                 ==================================================== */

              private void initializeWebView() {

                  webView =
                      new WebView(this);


                  WebSettings settings =
                      webView.getSettings();


                  settings.setJavaScriptEnabled(
                      true
                  );


                  settings.setDomStorageEnabled(
                      true
                  );


                  settings.setDatabaseEnabled(
                      true
                  );


                  settings.setAllowFileAccess(
                      true
                  );


                  settings.setAllowContentAccess(
                      true
                  );


                  settings.setMediaPlaybackRequiresUserGesture(
                      false
                  );


                  settings.setBuiltInZoomControls(
                      false
                  );


                  settings.setDisplayZoomControls(
                      false
                  );


                  settings.setSupportZoom(
                      false
                  );


                  webView.setWebViewClient(
                      new WebViewClient()
                  );


                  webView.setWebChromeClient(
                      new WebChromeClient() {

                          @Override
                          public void onPermissionRequest(
                              final PermissionRequest request
                          ) {

                              runOnUiThread(
                                  () -> {

                                      try {

                                          request.grant(
                                              request.getResources()
                                          );

                                      } catch(
                                          Exception ignored
                                      ) {}

                                  }
                              );

                          }

                      }
                  );


                  webView.addJavascriptInterface(
                      new SmritiNativeBridge(),
                      "SmritiNative"
                  );


                  setContentView(
                      webView
                  );


                  webView.loadUrl(
                      "file:///android_asset/smritiai/index.html"
                  );

              }


              /* ====================================================
                 TEXT TO SPEECH
                 ==================================================== */

              private void initializeTTS() {

                  tts =
                      new TextToSpeech(
                          this,
                          status -> {

                              if(
                                  status ==
                                  TextToSpeech.SUCCESS
                              ) {

                                  tts.setLanguage(
                                      Locale.US
                                  );

                                  tts.setSpeechRate(
                                      0.90f
                                  );

                                  tts.setPitch(
                                      1.0f
                                  );

                              }

                          }
                      );

              }


              private void speakText(
                  String text,
                  String language
              ) {

                  if(tts == null)
                      return;


                  Locale locale =
                      Locale.US;


                  if(
                      language != null &&
                      language.startsWith("hi")
                  ) {

                      locale =
                          new Locale(
                              "hi",
                              "IN"
                          );

                  }


                  if(
                      language != null &&
                      language.startsWith("mr")
                  ) {

                      locale =
                          new Locale(
                              "mr",
                              "IN"
                          );

                  }


                  try {

                      tts.setLanguage(
                          locale
                      );

                  } catch(
                      Exception ignored
                  ) {}


                  tts.speak(

                      text,

                      TextToSpeech.QUEUE_FLUSH,

                      null,

                      "smritiai"

                  );

              }


              /* ====================================================
                 SPEECH RECOGNITION
                 ==================================================== */

              private void startListening(
                  String language
              ) {

                  if(
                      !SpeechRecognizer
                          .isRecognitionAvailable(
                              this
                          )
                  ) {

                      sendSpeechResult(
                          ""
                      );

                      return;

                  }


                  if(
                      speechRecognizer != null
                  ) {

                      try {

                          speechRecognizer.destroy();

                      } catch(
                          Exception ignored
                      ) {}

                  }


                  speechRecognizer =
                      SpeechRecognizer
                          .createSpeechRecognizer(
                              this
                          );


                  speechRecognizer
                      .setRecognitionListener(

                          new RecognitionListener() {


                              @Override
                              public void onReadyForSpeech(
                                  Bundle params
                              ) {}


                              @Override
                              public void onBeginningOfSpeech() {}


                              @Override
                              public void onRmsChanged(
                                  float rmsdB
                              ) {}


                              @Override
                              public void onBufferReceived(
                                  byte[] buffer
                              ) {}


                              @Override
                              public void onEndOfSpeech() {}


                              @Override
                              public void onError(
                                  int error
                              ) {

                                  sendSpeechResult(
                                      ""
                                  );

                              }


                              @Override
                              public void onResults(
                                  Bundle results
                              ) {

                                  ArrayList<String>
                                      matches =
                                      results
                                      .getStringArrayList(
                                          SpeechRecognizer
                                          .RESULTS_RECOGNITION
                                      );


                                  if(
                                      matches != null &&
                                      !matches.isEmpty()
                                  ) {

                                      sendSpeechResult(
                                          matches.get(0)
                                      );

                                  } else {

                                      sendSpeechResult(
                                          ""
                                      );

                                  }

                              }


                              @Override
                              public void onPartialResults(
                                  Bundle partialResults
                              ) {}


                              @Override
                              public void onEvent(
                                  int eventType,
                                  Bundle params
                              ) {}

                          }

                      );


                  Intent intent =
                      new Intent(
                          RecognizerIntent
                          .ACTION_RECOGNIZE_SPEECH
                      );


                  intent.putExtra(
                      RecognizerIntent
                      .EXTRA_LANGUAGE_MODEL,

                      RecognizerIntent
                      .LANGUAGE_MODEL_FREE_FORM
                  );


                  intent.putExtra(
                      RecognizerIntent
                      .EXTRA_LANGUAGE,

                      language == null
                          ? "en-IN"
                          : language
                  );


                  intent.putExtra(
                      RecognizerIntent
                      .EXTRA_MAX_RESULTS,

                      1
                  );


                  try {

                      speechRecognizer
                          .startListening(
                              intent
                          );

                  } catch(
                      Exception error
                  ) {

                      sendSpeechResult(
                          ""
                      );

                  }

              }


              /* ====================================================
                 JAVASCRIPT RESULT
                 ==================================================== */

              private void sendSpeechResult(
                  String text
              ) {

                  if(webView == null)
                      return;


                  String safe =
                      text
                      .replace(
                          "\\",
                          "\\\\"
                      )
                      .replace(
                          "'",
                          "\\'"
                      )
                      .replace(
                          "\n",
                          " "
                      )
                      .replace(
                          "\r",
                          " "
                      );


                  runOnUiThread(
                      () -> {

                          webView.evaluateJavascript(

                              "window.__smritiSpeechResult && " +
                              "window.__smritiSpeechResult('" +
                              safe +
                              "');",

                              null

                          );

                      }
                  );

              }


              /* ====================================================
                 JAVASCRIPT BRIDGE
                 ==================================================== */

              public class SmritiNativeBridge {


                  @JavascriptInterface

                  public void speak(
                      String text,
                      String language
                  ) {

                      runOnUiThread(
                          () ->
                              speakText(
                                  text,
                                  language
                              )
                      );

                  }


                  @JavascriptInterface

                  public void startListening(
                      String language
                  ) {

                      runOnUiThread(
                          () ->
                              startListening(
                                  language
                              )
                      );

                  }

              }


              /* ====================================================
                 PERMISSIONS
                 ==================================================== */

              private void requestPermissionsIfNeeded() {

                  if(
                      android.os.Build.VERSION.SDK_INT
                      < 23
                  ) {

                      return;

                  }


                  ArrayList<String>
                      permissions =
                      new ArrayList<>();


                  if(
                      checkSelfPermission(
                          Manifest.permission.CAMERA
                      )
                      != PackageManager.PERMISSION_GRANTED
                  ) {

                      permissions.add(
                          Manifest.permission.CAMERA
                      );

                  }


                  if(
                      checkSelfPermission(
                          Manifest.permission.RECORD_AUDIO
                      )
                      != PackageManager.PERMISSION_GRANTED
                  ) {

                      permissions.add(
                          Manifest.permission.RECORD_AUDIO
                      );

                  }


                  if(
                      !permissions.isEmpty()
                  ) {

                      requestPermissions(

                          permissions.toArray(
                              new String[0]
                          ),

                          PERMISSION_REQUEST

                      );

                  }

              }


              /* ====================================================
                 BACK
                 ==================================================== */

              @Override

              public void onBackPressed() {

                  if(
                      webView != null &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();

                  }

              }


              /* ====================================================
                 CLEANUP
                 ==================================================== */

              @Override

              protected void onDestroy() {

                  if(
                      speechRecognizer != null
                  ) {

                      try {

                          speechRecognizer.destroy();

                      } catch(
                          Exception ignored
                      ) {}

                  }


                  if(
                      tts != null
                  ) {

                      try {

                          tts.stop();

                          tts.shutdown();

                      } catch(
                          Exception ignored
                      ) {}

                  }


                  if(
                      webView != null
                  ) {

                      webView.destroy();

                  }


                  super.onDestroy();

              }

          }

          EOF


      # ============================================================
      # 12. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 13. GRADLE 8.14.3
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"


      # ============================================================
      # 14. BUILD APK
      # ============================================================

      - name: Build SmritiAI APK
        working-directory: android_wrapper
        shell: bash
        run: |

          set -e

          echo "======================================"
          echo "BUILDING SMRITIAI APK"
          echo "======================================"


          gradle \
            assembleDebug \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 15. VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |

          set -e

          APK="android_wrapper/app/build/outputs/apk/debug/app-debug.apk"


          if [ ! -f "$APK" ]; then

              echo "ERROR: APK was not generated."

              exit 1

          fi


          SIZE=$(stat -c%s "$APK")


          echo ""
          echo "======================================"
          echo "SMRITIAI APK CREATED"
          echo "======================================"


          ls -lh "$APK"


          echo "APK size: $SIZE bytes"


          if [ "$SIZE" -lt 100000 ]; then

              echo "ERROR: APK is suspiciously small."

              exit 1

          fi


          echo "APK verification passed."


      # ============================================================
      # 16. RENAME
      # ============================================================

      - name: Create final SmritiAI APK
        shell: bash
        run: |

          cp \
            android_wrapper/app/build/outputs/apk/debug/app-debug.apk \
            SmritiAI.apk


          ls -lh SmritiAI.apk


      # ============================================================
      # 17. UPLOAD APK
      # ============================================================

      - name: Upload SmritiAI APK
        uses: actions/upload-artifact@v4
        with:

          name: SmritiAI-Android-v1.0.0

          path: SmritiAI.apk

          if-no-files-found: error


      # ============================================================
      # 18. DIAGNOSTICS
      # ============================================================

      - name: Upload diagnostics if build fails
        if: failure()

        uses: actions/upload-artifact@v4

        with:

          name: SmritiAI-Build-Diagnostics

          path: |

            smritiai_web/index.html

            android_wrapper/

          if-no-files-found: ignore
