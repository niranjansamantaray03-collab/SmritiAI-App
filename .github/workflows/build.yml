      # ============================================================
      # 9. CREATE WEBVIEW ACTIVITY
      # ============================================================

      - name: Create Android WebView
        shell: bash
        run: |
          set -e

          cat > android_wrapper/app/src/main/java/com/smritiai/app/MainActivity.java <<'EOF'
          package com.smritiai.app;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  requestPermissions(
                      new String[] {
                          Manifest.permission.CAMERA,
                          Manifest.permission.RECORD_AUDIO
                      },
                      1001
                  );

                  webView = new WebView(this);

                  WebSettings settings =
                      webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  settings.setMediaPlaybackRequiresUserGesture(
                      false
                  );

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setAllowFileAccessFromFileURLs(true);

                  settings.setAllowUniversalAccessFromFileURLs(true);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setSupportZoom(false);

                  settings.setLoadWithOverviewMode(false);

                  settings.setUseWideViewPort(true);

                  CookieManager cookies =
                      CookieManager.getInstance();

                  cookies.setAcceptCookie(true);

                  cookies.setAcceptThirdPartyCookies(
                      webView,
                      true
                  );

                  webView.setWebViewClient(
                      new WebViewClient() {

                          @Override
                          public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request
                          ) {

                              return false;

                          }

                      }
                  );

                  webView.setWebChromeClient(
                      new WebChromeClient() {

                          @Override
                          public void onPermissionRequest(
                              final PermissionRequest request
                          ) {

                              runOnUiThread(
                                  () -> {

                                      request.grant(
                                          request.getResources()
                                      );

                                  }
                              );

                          }

                      }
                  );

                  setContentView(webView);

                  webView.loadUrl(
                      "file:///android_asset/smritiai/index.html"
                  );

              }


              @Override
              public void onBackPressed() {

                  if (
                      webView != null &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();

                  }

              }


              @Override
              protected void onDestroy() {

                  if (webView != null) {

                      webView.stopLoading();

                      webView.destroy();

                      webView = null;

                  }

                  super.onDestroy();

              }

          }
          EOF


      # ============================================================
      # 10. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 11. GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"


      # ============================================================
      # 12. BUILD APK
      # ============================================================

      - name: Build SmritiAI APK
        working-directory: android_wrapper
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING SMRITIAI APK"
          echo "=========================================="

          gradle assembleDebug --no-daemon

          echo ""
          echo "BUILD FINISHED"


      # ============================================================
      # 13. VERIFY APK
      # ============================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="android_wrapper/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "ERROR: APK was not created."

            exit 1

          fi

          echo ""
          echo "=========================================="
          echo "SMRITIAI APK CREATED SUCCESSFULLY"
          echo "=========================================="

          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"


      # ============================================================
      # 14. UPLOAD APK
      # ============================================================

      - name: Upload SmritiAI APK
        uses: actions/upload-artifact@v4
        with:
          name: SmritiAI-Final-APK
          path: android_wrapper/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
