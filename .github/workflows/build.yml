name: Build SmritiAI Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. VERIFY SOURCE ZIP
      # ============================================================
      - name: Verify SmritiAI source
        shell: bash
        run: |
          set -e

          echo "Repository contents:"
          ls -la

          if [ ! -f "SmritiAI_Source final.zip" ]; then
            echo "ERROR: SmritiAI_Source final.zip was not found."
            exit 1
          fi

          echo "Source ZIP found:"
          ls -lh "SmritiAI_Source final.zip"

      # ============================================================
      # 3. EXTRACT ORIGINAL SMRITIAI APP
      # ============================================================
      - name: Extract SmritiAI source
        shell: bash
        run: |
          set -e

          rm -rf smritiai_source
          mkdir -p smritiai_source

          unzip -q "SmritiAI_Source final.zip" -d smritiai_source

          echo "Extracted files:"
          find smritiai_source -maxdepth 3 -type f | head -200

      # ============================================================
      # 4. FIND ORIGINAL INDEX.HTML
      # ============================================================
      - name: Locate SmritiAI web app
        shell: bash
        run: |
          set -e

          INDEX_FILE=$(find smritiai_source -type f -name "index.html" | head -1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found."
            exit 1
          fi

          echo "Found index.html:"
          echo "$INDEX_FILE"

          mkdir -p smritiai_web

          cp "$INDEX_FILE" smritiai_web/index.html

          echo "Web app copied:"
          ls -lh smritiai_web/index.html

      # ============================================================
      # 5. BACKUP ORIGINAL HTML
      # ============================================================
      - name: Backup original HTML
        shell: bash
        run: |
          set -e

          cp smritiai_web/index.html \
             smritiai_web/index_original.html

          echo "Original HTML backed up."

      # ============================================================
      # 6. INJECT FINAL SMRITIAI MOBILE CONTROLS
      #
      # LEFT SIDE:
      #   🔗 Caregiver
      #   🧠 RUDAS
      #   🎵 Music
      #   🚪 Logout
      #
      # RUDAS permanent original launcher is hidden.
      # Actual RUDAS assessment remains available.
      # ============================================================
      - name: Inject SmritiAI mobile controls
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("smritiai_web/index.html")
          html = p.read_text(encoding="utf-8")

          css = r'''
          <style id="smritiAndroidControlsCSS">

          /* ======================================================
             SMRITIAI ANDROID LEFT CONTROL RAIL
             ====================================================== */

          #smritiAndroidControls {
              position: fixed;
              left: 12px;
              bottom: 22px;
              z-index: 2147483647;

              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 10px;

              pointer-events: none;
          }

          .smritiAndroidIcon {
              width: 48px;
              height: 48px;

              border: none;
              border-radius: 50%;

              display: flex;
              align-items: center;
              justify-content: center;

              font-size: 22px;

              background: rgba(15, 23, 42, 0.94);
              color: white;

              box-shadow:
                  0 5px 18px rgba(0,0,0,.25),
                  0 1px 3px rgba(0,0,0,.25);

              cursor: pointer;

              pointer-events: auto;

              -webkit-tap-highlight-color: transparent;

              transition:
                  transform .15s ease,
                  opacity .15s ease;
          }

          .smritiAndroidIcon:active {
              transform: scale(.88);
          }

          .smritiAndroidIcon span {
              line-height: 1;
          }

          #smritiCaregiverIcon {
              background: #2563EB;
          }

          #smritiRudasIcon {
              background: #4F46E5;
          }

          #smritiMusicButton {
              background: #7C3AED;
          }

          #smritiLogoutIcon {
              background: #DC2626;
          }

          /* Hide old permanent RUDAS launcher */
          #smritiRudasLauncher {
              display: none !important;
          }

          /* Hide old connection floating button */
          #connectionFab {
              display: none !important;
          }

          /* Prevent old giant connection button from appearing */
          .connection-fab,
          .connect-caregiver-fab,
          .connectCaregiverFab {
              display: none !important;
          }

          /* ======================================================
             MOBILE TOUCH IMPROVEMENTS
             ====================================================== */

          button,
          .btn,
          [role="button"] {
              -webkit-tap-highlight-color: transparent;
          }

          /* ======================================================
             ANDROID SAFE AREA
             ====================================================== */

          @supports (padding-bottom: env(safe-area-inset-bottom)) {
              #smritiAndroidControls {
                  bottom: calc(22px + env(safe-area-inset-bottom));
              }
          }

          </style>
          '''

          controls = r'''
          <!-- =====================================================
               SMRITIAI ANDROID CONTROL RAIL
               ===================================================== -->

          <div id="smritiAndroidControls">

              <button
                  id="smritiCaregiverIcon"
                  class="smritiAndroidIcon"
                  type="button"
                  aria-label="Connect Caregiver"
                  title="Connect Caregiver">
                  <span>🔗</span>
              </button>

              <button
                  id="smritiRudasIcon"
                  class="smritiAndroidIcon"
                  type="button"
                  aria-label="RUDAS"
                  title="RUDAS">
                  <span>🧠</span>
              </button>

              <button
                  id="smritiMusicButton"
                  class="smritiAndroidIcon"
                  type="button"
                  aria-label="Music"
                  title="Music">
                  <span>🎵</span>
              </button>

              <button
                  id="smritiLogoutIcon"
                  class="smritiAndroidIcon"
                  type="button"
                  aria-label="Logout"
                  title="Logout">
                  <span>🚪</span>
              </button>

          </div>

          <script id="smritiAndroidControlsJS">
          (function(){

              "use strict";

              function getOverlay(){
                  return document.getElementById("smritiRudasOverlay");
              }

              /* ==================================================
                 CAREGIVER
                 ================================================== */

              function openCaregiver(){

                  try{

                      if(typeof openConnectionPanel === "function"){
                          openConnectionPanel();
                          return;
                      }

                      if(typeof connectionPanelHTML === "function"){
                          const html = connectionPanelHTML();

                          let existing =
                              document.getElementById("connectionPanel");

                          if(existing){
                              existing.remove();
                          }

                          const wrapper =
                              document.createElement("div");

                          wrapper.id = "connectionPanel";
                          wrapper.innerHTML = html;

                          document.body.appendChild(wrapper);

                          return;
                      }

                      if(typeof toast === "function"){
                          toast("Caregiver connection is loading...");
                      }

                  }catch(error){

                      console.error(
                          "Caregiver connection error:",
                          error
                      );

                  }

              }


              /* ==================================================
                 RUDAS
                 ================================================== */

              function openRudas(){

                  try{

                      const overlay = getOverlay();

                      if(!overlay){

                          if(typeof toast === "function"){
                              toast("RUDAS is loading...");
                          }

                          return;
                      }

                      overlay.style.display = "block";

                      if(typeof refreshAll === "function"){
                          refreshAll();
                      }

                  }catch(error){

                      console.error(
                          "RUDAS open error:",
                          error
                      );

                  }

              }


              /* ==================================================
                 MUSIC
                 ================================================== */

              function music(){

                  try{

                      if(typeof toggleMusic === "function"){

                          toggleMusic();

                          return;
                      }

                      if(typeof musicStart === "function"){

                          musicStart();

                          if(typeof toast === "function"){
                              toast("Music ON");
                          }

                          return;
                      }

                      if(typeof toast === "function"){
                          toast("Music is not available.");
                      }

                  }catch(error){

                      console.error(
                          "Music error:",
                          error
                      );

                  }

              }


              /* ==================================================
                 LOGOUT
                 ================================================== */

              function logout(){

                  try{

                      if(typeof go === "function"){

                          go("logout");

                          return;
                      }

                  }catch(error){

                      console.warn(
                          "go(logout) failed:",
                          error
                      );

                  }

                  try{

                      if(typeof db !== "undefined"){

                          db.active = null;

                          if(typeof saveDB === "function"){
                              saveDB();
                          }

                      }

                  }catch(error){

                      console.warn(
                          "DB logout failed:",
                          error
                      );

                  }

                  try{
                      localStorage.removeItem("smritiai_session");
                  }catch(e){}

                  location.reload();

              }


              /* ==================================================
                 INSTALL BUTTON EVENTS
                 ================================================== */

              function install(){

                  const caregiver =
                      document.getElementById(
                          "smritiCaregiverIcon"
                      );

                  const rudas =
                      document.getElementById(
                          "smritiRudasIcon"
                      );

                  const musicButton =
                      document.getElementById(
                          "smritiMusicButton"
                      );

                  const logoutButton =
                      document.getElementById(
                          "smritiLogoutIcon"
                      );

                  if(caregiver &&
                     !caregiver.dataset.bound){

                      caregiver.dataset.bound = "1";

                      caregiver.addEventListener(
                          "click",
                          openCaregiver
                      );

                  }

                  if(rudas &&
                     !rudas.dataset.bound){

                      rudas.dataset.bound = "1";

                      rudas.addEventListener(
                          "click",
                          openRudas
                      );

                  }

                  if(musicButton &&
                     !musicButton.dataset.bound){

                      musicButton.dataset.bound = "1";

                      musicButton.addEventListener(
                          "click",
                          music
                      );

                  }

                  if(logoutButton &&
                     !logoutButton.dataset.bound){

                      logoutButton.dataset.bound = "1";

                      logoutButton.addEventListener(
                          "click",
                          logout
                      );

                  }

              }


              /* ==================================================
                 STARTUP
                 ================================================== */

              if(document.readyState === "loading"){

                  document.addEventListener(
                      "DOMContentLoaded",
                      install
                  );

              }else{

                  install();

              }


              /* ==================================================
                 APP RE-RENDER SUPPORT
                 ================================================== */

              const observer =
                  new MutationObserver(function(){

                      install();

                  });

              observer.observe(
                  document.documentElement,
                  {
                      childList: true,
                      subtree: true
                  }
              );

          })();
          </script>
          '''

          marker = "</head>"

          if marker in html:
              html = html.replace(
                  marker,
                  css + "\n" + marker,
                  1
              )
          else:
              html = css + html

          body_marker = "</body>"

          if body_marker in html:
              html = html.replace(
                  body_marker,
                  controls + "\n" + body_marker,
                  1
              )
          else:
              html += controls

          p.write_text(html, encoding="utf-8")

          print("Android controls injected successfully.")
          PY

      # ============================================================
      # 7. INJECT NATIVE ANDROID VOICE BRIDGE
      #
      # Browser speech still remains available.
      # Android native TTS + SpeechRecognizer are added.
      # ============================================================
      - name: Inject Android native voice bridge
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("smritiai_web/index.html")
          html = p.read_text(encoding="utf-8")

          bridge = r'''
          <script id="smritiAndroidNativeBridge">
          (function(){

              "use strict";

              function nativeSpeak(text, language){

                  try{

                      if(
                          window.SmritiNative &&
                          typeof window.SmritiNative.speak === "function"
                      ){

                          window.SmritiNative.speak(
                              String(text || ""),
                              String(language || "en")
                          );

                          return true;

                      }

                  }catch(error){

                      console.warn(
                          "Native TTS error:",
                          error
                      );

                  }

                  return false;

              }


              function nativeListen(language){

                  try{

                      if(
                          window.SmritiNative &&
                          typeof window.SmritiNative.startListening === "function"
                      ){

                          window.SmritiNative.startListening(
                              String(language || "en")
                          );

                          return true;

                      }

                  }catch(error){

                      console.warn(
                          "Native speech error:",
                          error
                      );

                  }

                  return false;

              }


              window.SmritiAndroidVoice = {

                  speak: nativeSpeak,

                  listen: nativeListen

              };


              /*
               * Android Java calls this when speech recognition
               * produces a result.
               */

              window.__smritiSpeechResult =
                  function(text){

                      try{

                          text = String(text || "");

                          if(
                              typeof voiceCommand === "function"
                          ){

                              voiceCommand(text);

                              return;

                          }

                          if(
                              typeof storyListening !== "undefined" &&
                              storyListening &&
                              typeof storyFinal !== "undefined"
                          ){

                              storyFinal +=
                                  (storyFinal ? " " : "") +
                                  text;

                          }

                      }catch(error){

                          console.error(
                              "Speech result routing error:",
                              error
                          );

                      }

                  };


              /*
               * Replace the existing speak function when possible.
               * Native Android TTS becomes the preferred path.
               */

              const oldSpeak =
                  window.speak;

              window.speak =
                  function(text){

                      let language = "en";

                      try{

                          if(
                              typeof db !== "undefined" &&
                              db.active &&
                              db.active.language
                          ){

                              language =
                                  db.active.language;

                          }

                      }catch(e){}

                      if(
                          nativeSpeak(
                              text,
                              language
                          )
                      ){

                          return;

                      }

                      if(typeof oldSpeak === "function"){
                          oldSpeak(text);
                      }

                  };


              /*
               * Optional helper for future buttons.
               */

              window.smritiStartNativeListening =
                  nativeListen;

          })();
          </script>
          '''

          html = html.replace(
              "</body>",
              bridge + "\n</body>",
              1
          )

          p.write_text(html, encoding="utf-8")

          print("Native voice bridge injected.")
          PY

      # ============================================================
      # 8. CREATE ANDROID PROJECT DIRECTORIES
      # ============================================================
      - name: Create Android project structure
        shell: bash
        run: |
          set -e

          rm -rf android_wrapper

          mkdir -p android_wrapper

          mkdir -p android_wrapper/app/src/main/java/com/smritiai/app

          mkdir -p android_wrapper/app/src/main/res/values

          mkdir -p android_wrapper/app/src/main/assets/smritiai

          mkdir -p android_wrapper/gradle/wrapper

          echo "Android project directories created."

      # ============================================================
      # 9. ROOT SETTINGS.GRADLE
      # ============================================================
      - name: Create settings.gradle
        shell: bash
        run: |
          set -e

          cat > android_wrapper/settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "SmritiAI"

include(":app")
EOF

      # ============================================================
      # 10. ROOT BUILD.GRADLE
      # IMPORTANT:
      # Correct Gradle plugin syntax.
      # ============================================================
      - name: Create root build.gradle
        shell: bash
        run: |
          set -e

          cat > android_wrapper/build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.9.1' apply false
}
EOF

      # ============================================================
      # 11. GRADLE PROPERTIES
      # ============================================================
      - name: Create gradle.properties
        shell: bash
        run: |
          set -e

          cat > android_wrapper/gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
EOF

      # ============================================================
      # 12. APP BUILD.GRADLE
      # ============================================================
      - name: Create Android app build.gradle
        shell: bash
        run: |
          set -e

          cat > android_wrapper/app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smritiai.app'

    compileSdk 35

    defaultConfig {
        applicationId 'com.smritiai.app'

        minSdk 23

        targetSdk 35

        versionCode 1

        versionName '1.0.0'
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
            shrinkResources false

            proguardFiles(
                getDefaultProguardFile(
                    'proguard-android-optimize.txt'
                ),
                'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'

    implementation 'androidx.webkit:webkit:1.13.0'
}
EOF

          cat > android_wrapper/app/proguard-rules.pro <<'EOF'
# SmritiAI
# No custom ProGuard rules required.
EOF

      # ============================================================
      # 13. CREATE ANDROID THEME
      #
      # CRITICAL XML FIX:
      # XML declaration MUST BE THE VERY FIRST LINE.
      # ============================================================
      - name: Create Android theme
        shell: bash
        run: |
          set -e

          cat > android_wrapper/app/src/main/res/values/styles.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style
        name="AppTheme"
        parent="android:style/Theme.Material.Light.NoActionBar">

        <item name="android:fontFamily">sans</item>

        <item name="android:windowNoTitle">true</item>

        <item name="android:colorAccent">#2563EB</item>

        <item name="android:statusBarColor">#0F172A</item>

        <item name="android:navigationBarColor">#0F172A</item>

        <item name="android:windowLightStatusBar">false</item>

    </style>
</resources>
EOF

      # ============================================================
      # 14. VERIFY XML
      # ============================================================
      - name: Verify Android XML
        shell: bash
        run: |
          set -e

          echo "Checking styles.xml..."

          head -n 1 \
            android_wrapper/app/src/main/res/values/styles.xml

          test "$(head -n 1 android_wrapper/app/src/main/res/values/styles.xml)" = '<?xml version="1.0" encoding="utf-8"?>'

          echo "styles.xml XML declaration verified."

      # ============================================================
      # 15. CREATE ANDROID MANIFEST
      # ============================================================
      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          set -e

          cat > android_wrapper/app/src/main/AndroidManifest.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <!-- Internet -->
    <uses-permission
        android:name="android.permission.INTERNET" />

    <!-- Camera for RUDAS hand-jumble / visual tasks -->
    <uses-permission
        android:name="android.permission.CAMERA" />

    <!-- Microphone for speech recognition -->
    <uses-permission
        android:name="android.permission.RECORD_AUDIO" />

    <!-- Notifications -->
    <uses-permission
        android:name="android.permission.POST_NOTIFICATIONS" />

    <application
        android:allowBackup="true"
        android:usesCleartextTraffic="true"
        android:hardwareAccelerated="true"
        android:label="SmritiAI"
        android:theme="@style/AppTheme"
        android:supportsRtl="true">

        <activity
            android:name=".MainActivity"
            android:screenOrientation="portrait"
            android:exported="true">

            <intent-filter>

                <action
                    android:name="android.intent.action.MAIN" />

                <category
                    android:name="android.intent.category.LAUNCHER" />

            </intent-filter>

        </activity>

    </application>

</manifest>
EOF

      # ============================================================
      # 16. COPY WEB APP INTO ANDROID ASSETS
      # ============================================================
      - name: Copy SmritiAI web app into Android
        shell: bash
        run: |
          set -e

          rm -rf \
            android_wrapper/app/src/main/assets/smritiai

          mkdir -p \
            android_wrapper/app/src/main/assets/smritiai

          cp -R \
            smritiai_web/. \
            android_wrapper/app/src/main/assets/smritiai/

          echo "Android assets:"
          find \
            android_wrapper/app/src/main/assets/smritiai \
            -maxdepth 2 \
            -type f \
            | head -100

      # ============================================================
      # 17. CREATE MAIN ACTIVITY
      #
      # WebView:
      # - JavaScript
      # - localStorage
      # - database
      # - audio
      # - camera
      # - microphone
      # - native TTS
      # - native SpeechRecognizer
      # ============================================================
      - name: Create MainActivity.java
        shell: bash
        run: |
          set -e

          cat > android_wrapper/app/src/main/java/com/smritiai/app/MainActivity.java <<'EOF'
package com.smritiai.app;

import android.Manifest;
import android.app.Activity;
import android.content.Intent;
import android.content.pm.PackageManager;
import android.os.Bundle;
import android.speech.RecognitionListener;
import android.speech.RecognizerIntent;
import android.speech.SpeechRecognizer;
import android.speech.tts.TextToSpeech;
import android.webkit.PermissionRequest;
import android.webkit.WebChromeClient;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.webkit.JavascriptInterface;

import androidx.annotation.NonNull;
import androidx.core.app.ActivityCompat;
import androidx.core.content.ContextCompat;

import java.util.ArrayList;
import java.util.Locale;

public class MainActivity extends Activity
        implements TextToSpeech.OnInitListener {

    private WebView webView;

    private TextToSpeech textToSpeech;

    private SpeechRecognizer speechRecognizer;

    private static final int PERMISSION_REQUEST_CODE = 5001;

    private String pendingLanguage = "en";


    @Override
    protected void onCreate(Bundle savedInstanceState) {

        super.onCreate(savedInstanceState);

        getWindow().setStatusBarColor(
                android.graphics.Color.rgb(
                        15,
                        23,
                        42
                )
        );

        getWindow().setNavigationBarColor(
                android.graphics.Color.rgb(
                        15,
                        23,
                        42
                )
        );


        textToSpeech =
                new TextToSpeech(
                        this,
                        this
                );


        setupWebView();

        requestRequiredPermissions();

    }


    private void setupWebView() {

        webView =
                new WebView(this);


        WebSettings settings =
                webView.getSettings();


        settings.setJavaScriptEnabled(true);

        settings.setDomStorageEnabled(true);

        settings.setDatabaseEnabled(true);

        settings.setAllowFileAccess(true);

        settings.setAllowContentAccess(true);

        settings.setMediaPlaybackRequiresUserGesture(false);

        settings.setBuiltInZoomControls(false);

        settings.setDisplayZoomControls(false);

        settings.setSupportZoom(false);

        settings.setLoadWithOverviewMode(false);

        settings.setUseWideViewPort(false);


        webView.setWebViewClient(
                new WebViewClient()
        );


        webView.setWebChromeClient(
                new WebChromeClient() {

                    @Override
                    public void onPermissionRequest(
                            final PermissionRequest request) {

                        runOnUiThread(
                                () -> {

                                    request.grant(
                                            request.getResources()
                                    );

                                }
                        );

                    }

                }
        );


        webView.addJavascriptInterface(
                new AndroidBridge(),
                "SmritiNative"
        );


        setContentView(webView);


        webView.loadUrl(
                "file:///android_asset/smritiai/index.html"
        );

    }


    private void requestRequiredPermissions() {

        ArrayList<String> permissions =
                new ArrayList<>();


        if(
                ContextCompat.checkSelfPermission(
                        this,
                        Manifest.permission.RECORD_AUDIO
                ) != PackageManager.PERMISSION_GRANTED
        ) {

            permissions.add(
                    Manifest.permission.RECORD_AUDIO
            );

        }


        if(
                ContextCompat.checkSelfPermission(
                        this,
                        Manifest.permission.CAMERA
                ) != PackageManager.PERMISSION_GRANTED
        ) {

            permissions.add(
                    Manifest.permission.CAMERA
            );

        }


        if(
                android.os.Build.VERSION.SDK_INT >= 33
                &&
                ContextCompat.checkSelfPermission(
                        this,
                        Manifest.permission.POST_NOTIFICATIONS
                ) != PackageManager.PERMISSION_GRANTED
        ) {

            permissions.add(
                    Manifest.permission.POST_NOTIFICATIONS
            );

        }


        if(!permissions.isEmpty()) {

            ActivityCompat.requestPermissions(
                    this,
                    permissions.toArray(
                            new String[0]
                    ),
                    PERMISSION_REQUEST_CODE
            );

        }

    }


    @Override
    public void onInit(int status) {

        if(
                status ==
                TextToSpeech.SUCCESS
        ) {

            textToSpeech.setLanguage(
                    Locale.ENGLISH
            );

        }

    }


    private Locale getLocale(
            String language
    ) {

        if(language == null) {
            return Locale.ENGLISH;
        }


        switch(language) {

            case "hi":
                return new Locale(
                        "hi",
                        "IN"
                );

            case "mr":
                return new Locale(
                        "mr",
                        "IN"
                );

            case "en":
            default:
                return Locale.ENGLISH;

        }

    }


    private void speakText(
            String text,
            String language
    ) {

        if(textToSpeech == null) {
            return;
        }

        if(text == null) {
            return;
        }

        text = text.trim();

        if(text.isEmpty()) {
            return;
        }


        Locale locale =
                getLocale(language);


        textToSpeech.setLanguage(
                locale
        );


        textToSpeech.setSpeechRate(
                0.92f
        );


        textToSpeech.setPitch(
                1.0f
        );


        textToSpeech.speak(
                text,
                TextToSpeech.QUEUE_FLUSH,
                null,
                "smritiai_tts"
        );

    }


    private void startNativeSpeech(
            String language
    ) {

        pendingLanguage =
                language == null
                        ? "en"
                        : language;


        if(
                ContextCompat.checkSelfPermission(
                        this,
                        Manifest.permission.RECORD_AUDIO
                ) != PackageManager.PERMISSION_GRANTED
        ) {

            ActivityCompat.requestPermissions(
                    this,
                    new String[]{
                            Manifest.permission.RECORD_AUDIO
                    },
                    PERMISSION_REQUEST_CODE
            );

            return;

        }


        if(
                !SpeechRecognizer.isRecognitionAvailable(
                        this
                )
        ) {

            sendSpeechResult(
                    ""
            );

            return;

        }


        if(speechRecognizer != null) {

            try {
                speechRecognizer.destroy();
            } catch(Exception ignored) {}

        }


        speechRecognizer =
                SpeechRecognizer.createSpeechRecognizer(
                        this
                );


        speechRecognizer.setRecognitionListener(
                new RecognitionListener() {

                    @Override
                    public void onReadyForSpeech(
                            Bundle params
                    ) {}

                    @Override
                    public void onBeginningOfSpeech() {}

                    @Override
                    public void onRmsChanged(
                            float rmsdB
                    ) {}

                    @Override
                    public void onBufferReceived(
                            byte[] buffer
                    ) {}

                    @Override
                    public void onEndOfSpeech() {}


                    @Override
                    public void onError(
                            int error
                    ) {

                        sendSpeechResult(
                                ""
                        );

                    }


                    @Override
                    public void onResults(
                            Bundle results
                    ) {

                        if(results == null) {

                            sendSpeechResult(
                                    ""
                            );

                            return;

                        }


                        ArrayList<String> matches =
                                results.getStringArrayList(
                                        SpeechRecognizer.RESULTS_RECOGNITION
                                );


                        if(
                                matches != null &&
                                !matches.isEmpty()
                        ) {

                            sendSpeechResult(
                                    matches.get(0)
                            );

                        } else {

                            sendSpeechResult(
                                    ""
                            );

                        }

                    }


                    @Override
                    public void onPartialResults(
                            Bundle partialResults
                    ) {}


                    @Override
                    public void onEvent(
                            int eventType,
                            Bundle params
                    ) {}

                }
        );


        Intent intent =
                new Intent(
                        RecognizerIntent.ACTION_RECOGNIZE_SPEECH
                );


        intent.putExtra(
                RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
        );


        intent.putExtra(
                RecognizerIntent.EXTRA_LANGUAGE,
                getLocale(
                        pendingLanguage
                )
        );


        intent.putExtra(
                RecognizerIntent.EXTRA_MAX_RESULTS,
                1
        );


        speechRecognizer.startListening(
                intent
        );

    }


    private void sendSpeechResult(
            String text
    ) {

        if(webView == null) {
            return;
        }


        final String safeText =
                text == null
                        ? ""
                        : text
                            .replace(
                                    "\\",
                                    "\\\\"
                            )
                            .replace(
                                    "'",
                                    "\\'"
                            )
                            .replace(
                                    "\n",
                                    " "
                            )
                            .replace(
                                    "\r",
                                    " "
                            );


        runOnUiThread(
                () -> {

                    webView.evaluateJavascript(
                            "window.__smritiSpeechResult('" +
                            safeText +
                            "');",
                            null
                    );

                }
        );

    }


    public class AndroidBridge {

        @JavascriptInterface
        public void speak(
                String text,
                String language
        ) {

            runOnUiThread(
                    () -> speakText(
                            text,
                            language
                    )
            );

        }


        @JavascriptInterface
        public void startListening(
                String language
        ) {

            runOnUiThread(
                    () -> startNativeSpeech(
                            language
                    )
            );

        }

    }


    @Override
    protected void onDestroy() {

        if(speechRecognizer != null) {

            try {
                speechRecognizer.destroy();
            } catch(Exception ignored) {}

            speechRecognizer = null;

        }


        if(textToSpeech != null) {

            try {
                textToSpeech.stop();
                textToSpeech.shutdown();
            } catch(Exception ignored) {}

            textToSpeech = null;

        }


        if(webView != null) {

            webView.stopLoading();

            webView.destroy();

            webView = null;

        }


        super.onDestroy();

    }


    @Override
    public void onBackPressed() {

        if(
                webView != null &&
                webView.canGoBack()
        ) {

            webView.goBack();

        } else {

            super.onBackPressed();

        }

    }

}
