name: Build SmritiAI iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. FIND AND EXTRACT SMRITIAI HTML
      # ============================================================

      - name: Extract SmritiAI source
        shell: bash
        run: |
          set -e

          rm -rf smritiai_source
          mkdir -p smritiai_source

          unzip -q "SmritiAI_Source final.zip" -d smritiai_source

          INDEX_FILE=$(find smritiai_source \
            -type f \
            -name "index.html" \
            | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html was not found."
            exit 1
          fi

          echo "Found SmritiAI:"
          echo "$INDEX_FILE"

          echo "INDEX_FILE=$INDEX_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 3. CREATE IOS APP STRUCTURE
      # ============================================================

      - name: Create iOS application
        shell: bash
        run: |
          set -e

          rm -rf SmritiAI-iOS

          mkdir -p \
            SmritiAI-iOS/SmritiAI.app

          mkdir -p \
            SmritiAI-iOS/Source


      # ============================================================
      # 4. COPY WEB APP INTO IOS BUNDLE
      # ============================================================

      - name: Copy SmritiAI web application
        shell: bash
        run: |
          set -e

          WEB_ROOT=$(dirname "$INDEX_FILE")

          echo "Copying web application:"
          echo "$WEB_ROOT"

          cp -R "$WEB_ROOT"/. \
            SmritiAI-iOS/SmritiAI.app/

          test -f \
            SmritiAI-iOS/SmritiAI.app/index.html

          echo "SmritiAI web application copied."


      # ============================================================
      # 5. PRESERVE MUSIC
      # ============================================================

      - name: Preserve SmritiAI music
        shell: bash
        run: |
          set -e

          MUSIC_FILE=$(find smritiai_source \
            -type f \
            -name "welcome_nostalgia.wav" \
            | head -n 1)

          if [ -n "$MUSIC_FILE" ]; then

            mkdir -p \
              SmritiAI-iOS/SmritiAI.app/assets/audio

            cp "$MUSIC_FILE" \
              SmritiAI-iOS/SmritiAI.app/assets/audio/

            echo "SmritiAI nostalgia music included."

          else

            echo "welcome_nostalgia.wav not found."
            echo "Existing HTML music remains unchanged."

          fi


      # ============================================================
      # 6. CREATE IOS WEBVIEW APP
      # ============================================================

      - name: Create WKWebView application
        shell: bash
        run: |

          cat > SmritiAI-iOS/Source/main.swift <<'EOF'

          import UIKit
          import WebKit
          import AVFoundation

          final class ViewController:
              UIViewController,
              WKNavigationDelegate,
              WKUIDelegate,
              WKScriptMessageHandler,
              WKDownloadDelegate {

              private var webView: WKWebView!

              override func viewDidLoad() {

                  super.viewDidLoad()

                  view.backgroundColor = .white

                  let configuration =
                      WKWebViewConfiguration()

                  configuration.allowsInlineMediaPlayback = true

                  configuration.mediaTypesRequiringUserActionForPlayback = []

                  configuration.preferences.javaScriptEnabled = true

                  configuration.websiteDataStore =
                      WKWebsiteDataStore.default()

                  configuration.userContentController
                      .add(
                          self,
                          name: "smritiai"
                      )

                  webView =
                      WKWebView(
                          frame: .zero,
                          configuration: configuration
                      )

                  webView.navigationDelegate = self

                  webView.uiDelegate = self

                  webView.translatesAutoresizingMaskIntoConstraints = false

                  view.addSubview(webView)

                  NSLayoutConstraint.activate([

                      webView.leadingAnchor.constraint(
                          equalTo: view.leadingAnchor
                      ),

                      webView.trailingAnchor.constraint(
                          equalTo: view.trailingAnchor
                      ),

                      webView.topAnchor.constraint(
                          equalTo: view.topAnchor
                      ),

                      webView.bottomAnchor.constraint(
                          equalTo: view.bottomAnchor
                      )

                  ])


                  loadSmritiAI()
              }


              private func loadSmritiAI() {

                  guard
                      let url =
                          Bundle.main.url(
                              forResource: "index",
                              withExtension: "html"
                          )
                  else {

                      print(
                          "SmritiAI index.html not found"
                      )

                      return
                  }


                  webView.loadFileURL(
                      url,
                      allowingReadAccessTo:
                          Bundle.main.bundleURL
                  )
              }


              func userContentController(
                  _ userContentController: WKUserContentController,
                  didReceive message: WKScriptMessage
              ) {

                  print(
                      "SmritiAI message:",
                      message.body
                  )
              }


              override var prefersStatusBarHidden: Bool {

                  return false
              }


              override var preferredStatusBarStyle:
                  UIStatusBarStyle {

                  return .darkContent
              }


              override func viewDidAppear(
                  _ animated: Bool
              ) {

                  super.viewDidAppear(animated)

                  UIApplication.shared.isIdleTimerDisabled = false
              }


              deinit {

                  webView?.configuration
                      .userContentController
                      .removeScriptMessageHandler(
                          forName: "smritiai"
                      )
              }
          }


          @main
          final class AppDelegate:
              UIResponder,
              UIApplicationDelegate {

              var window: UIWindow?

              func application(
                  _ application: UIApplication,
                  didFinishLaunchingWithOptions
                  launchOptions:
                  [UIApplication.LaunchOptionsKey: Any]?
              ) -> Bool {

                  let window =
                      UIWindow(
                          frame:
                              UIScreen.main.bounds
                      )

                  window.rootViewController =
                      ViewController()

                  self.window = window

                  window.makeKeyAndVisible()

                  return true
              }
          }

          EOF


      # ============================================================
      # 7. COMPILE IOS APPLICATION
      # ============================================================

      - name: Compile iOS application
        shell: bash
        run: |
          set -e

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          xcrun swiftc \
            -sdk "$SDK" \
            -target arm64-apple-ios15.0 \
            -framework UIKit \
            -framework WebKit \
            -framework AVFoundation \
            -o SmritiAI-iOS/SmritiAI.app/SmritiAI \
            SmritiAI-iOS/Source/main.swift

          echo "iOS executable compiled."


      # ============================================================
      # 8. CREATE INFO.PLIST
      # ============================================================

      - name: Create Info.plist
        shell: bash
        run: |

          cat > SmritiAI-iOS/SmritiAI.app/Info.plist <<'EOF'

          <?xml version="1.0" encoding="UTF-8"?>

          <!DOCTYPE plist PUBLIC
          "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">

          <dict>

              <key>CFBundleDisplayName</key>
              <string>SmritiAI</string>

              <key>CFBundleName</key>
              <string>SmritiAI</string>

              <key>CFBundleIdentifier</key>
              <string>com.smritiai.app</string>

              <key>CFBundleExecutable</key>
              <string>SmritiAI</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>LSRequiresIPhoneOS</key>
              <true/>

              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>

              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>

              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>

              <key>NSCameraUsageDescription</key>
              <string>
                  SmritiAI uses the camera for cognitive assessment activities.
              </string>

              <key>NSMicrophoneUsageDescription</key>
              <string>
                  SmritiAI uses the microphone for voice interaction and speech activities.
              </string>

              <key>NSSpeechRecognitionUsageDescription</key>
              <string>
                  SmritiAI uses speech recognition for voice interaction.
              </string>

          </dict>

          </plist>

          EOF


      # ============================================================
      # 9. CREATE LAUNCH SCREEN
      # ============================================================

      - name: Create launch screen
        shell: bash
        run: |

          cat > SmritiAI-iOS/SmritiAI.app/LaunchScreen.storyboard <<'EOF'

          <?xml version="1.0" encoding="UTF-8"?>

          <document
              type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB"
              version="3.0"
              toolsVersion="21701"
              targetRuntime="iOS.CocoaTouch"
              propertyAccessControl="none"
              useAutolayout="YES"
              useTraitCollections="YES"
              useSafeAreas="YES"
              colorMatched="YES">

              <scenes>

                  <scene
                      sceneID="SmritiAI-Launch">

                      <objects>

                          <viewController
                              id="SmritiAIViewController"
                              sceneMemberID="viewController">

                              <view
                                  key="view"
                                  contentMode="scaleToFill"
                                  id="SmritiAIView">

                                  <rect
                                      key="frame"
                                      x="0.0"
                                      y="0.0"
                                      width="390"
                                      height="844"/>

                                  <autoresizingMask
                                      key="autoresizingMask"
                                      widthSizable="YES"
                                      heightSizable="YES"/>

                                  <color
                                      key="backgroundColor"
                                      white="1.0"
                                      alpha="1.0"
                                      colorSpace="custom"
                                      customColorSpace="genericGamma22GrayColorSpace"/>

                              </view>

                          </viewController>

                          <placeholder
                              placeholderIdentifier="IBFirstResponder"
                              id="FirstResponder"
                              sceneMemberID="firstResponder"/>

                      </objects>

                  </scene>

              </scenes>

          </document>

          EOF


      # ============================================================
      # 10. AD-HOC SIGN FOR BUILD ARTIFACT
      # ============================================================

      - name: Ad hoc sign application
        shell: bash
        run: |

          set -e

          xcrun codesign \
            --force \
            --deep \
            --sign - \
            SmritiAI-iOS/SmritiAI.app

          echo "Application bundle signed with temporary local signature."


      # ============================================================
      # 11. PACKAGE IPA
      # ============================================================

      - name: Create IPA
        shell: bash
        run: |

          set -e

          rm -rf SmritiAI-iOS/Payload

          mkdir -p SmritiAI-iOS/Payload

          cp -R \
            SmritiAI-iOS/SmritiAI.app \
            SmritiAI-iOS/Payload/SmritiAI.app

          cd SmritiAI-iOS

          zip -qry \
            SmritiAI.ipa \
            Payload

          cd ..

          ls -lh \
            SmritiAI-iOS/SmritiAI.ipa


      # ============================================================
      # 12. UPLOAD IPA
      # ============================================================

      - name: Upload SmritiAI iOS
        uses: actions/upload-artifact@v4

        with:

          name: SmritiAI-iOS

          path: |
            SmritiAI-iOS/SmritiAI.ipa
            SmritiAI-iOS/SmritiAI.app

          retention-days: 30
