name: Build SmritiAI Final Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. EXTRACT ORIGINAL SMRITIAI ZIP
      # ============================================================

      - name: Extract SmritiAI source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACTING SMRITIAI SOURCE"
          echo "=========================================="

          ZIP="SmritiAI_Source final.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found."
            exit 1
          fi

          rm -rf smritiai_source
          mkdir -p smritiai_source

          unzip -q "$ZIP" -d smritiai_source

          echo ""
          echo "ZIP CONTENTS:"
          find smritiai_source -maxdepth 5 -type f | sort | head -300


      # ============================================================
      # 3. LOCATE THE REAL SMRITIAI APPLICATION
      # ============================================================

      - name: Locate SmritiAI application
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR SMRITIAI APPLICATION"
          echo "=========================================="

          FOUND=""

          while IFS= read -r FILE; do

            echo ""
            echo "Checking:"
            echo "$FILE"

            SIZE=$(wc -c < "$FILE")

            echo "Size: $SIZE bytes"

            if grep -qiE \
              "SmritiAI|smritiai_v3|Connect Caregiver|RUDAS|caregiver|patient" \
              "$FILE"; then

              echo ">>> SmritiAI candidate found"

              FOUND="$FILE"

              break
            fi

          done < <(
            find smritiai_source \
              -type f \
              -iname "index.html" \
              -print
          )

          if [ -z "$FOUND" ]; then

            echo ""
            echo "ERROR: SmritiAI index.html was not found."

            echo ""
            echo "HTML FILES:"
            find smritiai_source \
              -type f \
              -iname "*.html" \
              -print

            exit 1
          fi

          WEB_ROOT=$(dirname "$FOUND")

          echo ""
          echo "=========================================="
          echo "SMRITIAI APPLICATION FOUND"
          echo "=========================================="

          echo "INDEX:"
          echo "$FOUND"

          echo ""
          echo "WEB ROOT:"
          echo "$WEB_ROOT"

          echo "INDEX_FILE=$FOUND" >> "$GITHUB_ENV"
          echo "WEB_ROOT=$WEB_ROOT" >> "$GITHUB_ENV"


      # ============================================================
      # 4. VERIFY ORIGINAL APP
      # ============================================================

      - name: Verify original SmritiAI
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING ORIGINAL SMRITIAI"
          echo "=========================================="

          test -f "$INDEX_FILE"

          SIZE=$(wc -c < "$INDEX_FILE")

          echo ""
          echo "Original index.html size:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 20000 ]; then
            echo "WARNING: index.html is unusually small."
          fi

          echo ""
          echo "SmritiAI:"
          grep -oi "SmritiAI" "$INDEX_FILE" | head -10 || true

          echo ""
          echo "RUDAS:"
          grep -oi "RUDAS" "$INDEX_FILE" | head -20 || true

          echo ""
          echo "Caregiver:"
          grep -oi "caregiver" "$INDEX_FILE" | head -20 || true

          echo ""
          echo "Music/audio:"
          grep -oiE \
            "music|song|audio|playSound|sound|nostalgia" \
            "$INDEX_FILE" \
            | sort \
            | uniq \
            | head -50 || true

          echo ""
          echo "Original HTML verified."


      # ============================================================
      # 5. CREATE ANDROID PROJECT
      # ============================================================

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf android_wrapper

          mkdir -p \
            android_wrapper/app/src/main/java/com/smritiai/app

          mkdir -p \
            android_wrapper/app/src/main/assets/smritiai

          mkdir -p \
            android_wrapper/app/src/main/res/values


          # --------------------------------------------------------
          # settings.gradle
          # --------------------------------------------------------

          cat > android_wrapper/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SmritiAI"

          include(":app")
          EOF


          # --------------------------------------------------------
          # root build.gradle
          # --------------------------------------------------------

          cat > android_wrapper/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.9.1" apply false
          }
          EOF


          # --------------------------------------------------------
          # gradle.properties
          # --------------------------------------------------------

          cat > android_wrapper/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF


          # --------------------------------------------------------
          # app/build.gradle
          # --------------------------------------------------------

          cat > android_wrapper/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.smritiai.app"

              compileSdk 35

              defaultConfig {
                  applicationId "com.smritiai.app"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF


          # --------------------------------------------------------
          # Android Manifest
          # --------------------------------------------------------

          cat > android_wrapper/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.ACCESS_NETWORK_STATE" />

              <uses-permission
                  android:name="android.permission.CAMERA" />

              <uses-permission
                  android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="SmritiAI"
                  android:resizeableActivity="true"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


          # --------------------------------------------------------
          # Theme
          # --------------------------------------------------------

          cat > android_wrapper/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">#2563EB</item>

                  <item name="android:navigationBarColor">#FFFFFF</item>

                  <item name="android:statusBarColor">#FFFFFF</item>

                  <item name="android:windowLightStatusBar">true</item>

                  <item name="android:windowNoTitle">true</item>

              </style>

          </resources>
          EOF


      # ============================================================
      # 6. COPY THE COMPLETE ORIGINAL WEB APP
      # ============================================================

      - name: Copy complete SmritiAI web application
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "COPYING ORIGINAL SMRITIAI"
          echo "=========================================="

          rm -rf \
            android_wrapper/app/src/main/assets/smritiai/*

          cp -R "$WEB_ROOT"/. \
            android_wrapper/app/src/main/assets/smritiai/

          test -f \
            android_wrapper/app/src/main/assets/smritiai/index.html

          echo ""
          echo "APPLICATION FILES:"
          find \
            android_wrapper/app/src/main/assets/smritiai \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -300

          echo ""
          echo "INDEX SIZE:"
          wc -c \
            android_wrapper/app/src/main/assets/smritiai/index.html


      # ============================================================
      # 7. MODIFY ONLY THE UI CONTROLS
      #
      # IMPORTANT:
      # - Existing app is preserved.
      # - Existing music system is preserved.
      # - RUDAS assessment is preserved.
      # - Only permanent RUDAS floating control is hidden.
      # - Small side icons are added.
      # ============================================================

      - name: Add SmritiAI side controls
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          html_path = Path(
              "android_wrapper/app/src/main/assets/smritiai/index.html"
          )

          html = html_path.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          original_size = len(html)

          print("Original HTML characters:", original_size)

          injection = r'''
          <!-- ======================================================
               SMRITIAI ANDROID SIDE CONTROLS
               This layer does NOT replace the original app.
               ====================================================== -->

          <style id="smritiai-android-controls-style">

            #smritiai-side-controls {
              position: fixed;
              right: 12px;
              bottom: 92px;
              z-index: 2147483000;

              display: flex;
              flex-direction: column;
              gap: 10px;

              pointer-events: auto;
            }

            .smritiai-side-button {
              width: 48px;
              height: 48px;

              border: 0;
              border-radius: 50%;

              display: flex;
              align-items: center;
              justify-content: center;

              font-size: 22px;

              background: rgba(255,255,255,0.96);

              box-shadow:
                0 3px 14px rgba(0,0,0,0.18);

              cursor: pointer;

              -webkit-tap-highlight-color: transparent;

              transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
            }

            .smritiai-side-button:active {
              transform: scale(0.90);
            }

            .smritiai-side-button.music {
              background: #fff7d6;
            }

            .smritiai-side-button.caregiver {
              background: #e7f0ff;
            }

            .smritiai-side-button.logout {
              background: #ffe8e8;
            }

            .smritiai-side-label {
              position: absolute;

              right: 58px;

              white-space: nowrap;

              padding: 6px 9px;

              border-radius: 8px;

              background: rgba(20,20,20,0.88);

              color: white;

              font-size: 12px;

              opacity: 0;

              pointer-events: none;

              transform: translateX(5px);

              transition:
                opacity 0.15s ease,
                transform 0.15s ease;
            }

            .smritiai-side-wrap {
              position: relative;
              display: flex;
              justify-content: flex-end;
            }

            .smritiai-side-wrap:hover .smritiai-side-label {
              opacity: 1;
              transform: translateX(0);
            }

            /*
             * Hide ONLY the permanent RUDAS/Progress floating
             * control.
             *
             * We deliberately do NOT hide:
             * - RUDAS assessment screens
             * - RUDAS questions
             * - RUDAS result pages
             * - RUDAS history
             * - RUDAS progress data
             */

            .smritiai-hide-rudas-floating {
              display: none !important;
              visibility: hidden !important;
              opacity: 0 !important;
              pointer-events: none !important;
            }

            @media (max-width: 600px) {

              #smritiai-side-controls {
                right: 8px;
                bottom: 82px;
                gap: 8px;
              }

              .smritiai-side-button {
                width: 44px;
                height: 44px;
                font-size: 20px;
              }

            }

          </style>

          <div
            id="smritiai-side-controls"
            aria-label="SmritiAI quick controls">

            <div class="smritiai-side-wrap">

              <span class="smritiai-side-label">
                Caregiver
              </span>

              <button
                id="smritiai-caregiver-side-button"
                class="smritiai-side-button caregiver"
                type="button"
                aria-label="Connect Caregiver"
                title="Connect Caregiver">

                👨‍👩‍👧

              </button>

            </div>


            <div class="smritiai-side-wrap">

              <span class="smritiai-side-label">
                Music
              </span>

              <button
                id="smritiai-music-side-button"
                class="smritiai-side-button music"
                type="button"
                aria-label="Music"
                title="Music">

                🎵

              </button>

            </div>


            <div class="smritiai-side-wrap">

              <span class="smritiai-side-label">
                Logout
              </span>

              <button
                id="smritiai-logout-side-button"
                class="smritiai-side-button logout"
                type="button"
                aria-label="Logout"
                title="Logout">

                🚪

              </button>

            </div>

          </div>


          <script id="smritiai-android-controls-script">

          (function () {

            "use strict";


            /*
             * Small delay so the original SmritiAI application
             * has time to create its own buttons and screens.
             */

            function afterAppLoads(callback) {

              if (
                document.readyState === "complete" ||
                document.readyState === "interactive"
              ) {

                setTimeout(callback, 700);

              } else {

                document.addEventListener(
                  "DOMContentLoaded",
                  function () {
                    setTimeout(callback, 700);
                  },
                  { once: true }
                );

              }

            }


            /*
             * Normalize text for searching.
             */

            function cleanText(value) {

              return String(value || "")
                .replace(/\s+/g, " ")
                .trim()
                .toLowerCase();

            }


            /*
             * Get visible clickable elements.
             */

            function getClickableElements() {

              return Array.from(
                document.querySelectorAll(
                  "button, a, [role='button'], input[type='button'], input[type='submit'], [onclick]"
                )
              );

            }


            /*
             * Find an existing SmritiAI control.
             *
             * We use the original application's button whenever
             * possible instead of creating a duplicate function.
             */

            function findExistingControl(keywords) {

              var elements = getClickableElements();

              for (var i = 0; i < elements.length; i++) {

                var element = elements[i];

                if (
                  element.id &&
                  element.id.indexOf("smritiai-") === 0
                ) {
                  continue;
                }

                var text = cleanText(
                  element.innerText ||
                  element.textContent ||
                  element.value ||
                  element.getAttribute("aria-label") ||
                  element.getAttribute("title")
                );

                if (!text) {
                  continue;
                }

                for (var j = 0; j < keywords.length; j++) {

                  if (text.indexOf(keywords[j]) !== -1) {

                    return element;

                  }

                }

              }

              return null;

            }


            /*
             * Click the original application control.
             */

            function clickOriginalControl(keywords) {

              var control =
                findExistingControl(keywords);

              if (control) {

                console.log(
                  "SmritiAI side control -> original control:",
                  keywords
                );

                try {

                  control.click();

                  return true;

                } catch (error) {

                  console.log(
                    "Normal click failed:",
                    error
                  );

                  try {

                    control.dispatchEvent(
                      new MouseEvent(
                        "click",
                        {
                          bubbles: true,
                          cancelable: true,
                          view: window
                        }
                      )
                    );

                    return true;

                  } catch (secondError) {

                    console.log(
                      "Fallback click failed:",
                      secondError
                    );

                  }

                }

              }

              return false;

            }


            /*
             * ------------------------------------------------------
             * HIDE ONLY THE PERMANENT RUDAS/PROGRESS FLOATING BUTTON
             * ------------------------------------------------------
             *
             * We do NOT remove every RUDAS reference.
             */

            function hideRudasProgressButton() {

              var elements =
                getClickableElements();

              var hidden = 0;

              elements.forEach(function (element) {

                if (
                  element.id &&
                  element.id.indexOf("smritiai-") === 0
                ) {
                  return;
                }

                var text = cleanText(
                  element.innerText ||
                  element.textContent ||
                  element.getAttribute("aria-label") ||
                  element.getAttribute("title")
                );

                if (!text) {
                  return;
                }


                /*
                 * Exact/strong matches for the floating
                 * RUDAS & Progress control.
                 */

                var isRudasFloating =
                  text === "rudas & progress" ||
                  text === "rudas and progress" ||
                  text === "rudas progress" ||
                  text === "rudas & progress →" ||
                  text.indexOf("rudas & progress") !== -1 ||
                  text.indexOf("rudas and progress") !== -1;


                if (!isRudasFloating) {
                  return;
                }


                /*
                 * Only hide controls that look like floating
                 * navigation/action controls.
                 *
                 * The actual RUDAS assessment is left alone.
                 */

                element.classList.add(
                  "smritiai-hide-rudas-floating"
                );

                hidden++;

              });

              if (hidden > 0) {

                console.log(
                  "SmritiAI: hidden RUDAS Progress floating control:",
                  hidden
                );

              }

            }


            /*
             * ------------------------------------------------------
             * CAREGIVER
             * ------------------------------------------------------
             */

            function openCaregiver() {

              var opened =
                clickOriginalControl([
                  "connect caregiver",
                  "connect to caregiver",
                  "caregiver connection",
                  "caregiver"
                ]);

              if (opened) {
                return;
              }


              /*
               * Try common existing IDs from the original app.
               */

              var possibleIds = [
                "connect-caregiver",
                "connectCaregiver",
                "caregiver-connect",
                "caregiverConnection",
                "caregiverBtn"
              ];

              for (
                var i = 0;
                i < possibleIds.length;
                i++
              ) {

                var element =
                  document.getElementById(
                    possibleIds[i]
                  );

                if (element) {

                  element.click();

                  return;

                }

              }

              console.log(
                "SmritiAI: existing caregiver control not found."
              );

            }


            /*
             * ------------------------------------------------------
             * MUSIC
             * ------------------------------------------------------
             *
             * IMPORTANT:
             * We do NOT replace the original music system.
             *
             * The side icon first searches for the existing
             * music/song/play controls and clicks them.
             */

            function openMusic() {

              var opened =
                clickOriginalControl([
                  "music",
                  "song",
                  "play music",
                  "play song",
                  "nostalgia",
                  "listen"
                ]);

              if (opened) {
                return;
              }


              /*
               * Try common music IDs.
               */

              var possibleIds = [
                "music",
                "musicButton",
                "musicBtn",
                "playMusic",
                "playMusicButton",
                "song",
                "songButton",
                "audio",
                "audioButton",
                "nostalgiaMusic",
                "welcomeMusic"
              ];

              for (
                var i = 0;
                i < possibleIds.length;
                i++
              ) {

                var element =
                  document.getElementById(
                    possibleIds[i]
                  );

                if (element) {

                  element.click();

                  return;

                }

              }


              /*
               * If the original app exposes a music function,
               * use it without replacing it.
               */

              var functionNames = [
                "toggleMusic",
                "toggleAudio",
                "playMusic",
                "playSong",
                "startMusic",
                "startAudio",
                "playWelcomeMusic",
                "playNostalgiaMusic"
              ];

              for (
                var j = 0;
                j < functionNames.length;
                j++
              ) {

                var fn =
                  window[functionNames[j]];

                if (typeof fn === "function") {

                  try {

                    fn();

                    return;

                  } catch (error) {

                    console.log(
                      "Music function failed:",
                      functionNames[j],
                      error
                    );

                  }

                }

              }


              /*
               * Look for HTML audio elements already belonging
               * to the original application.
               */

              var audios =
                Array.from(
                  document.querySelectorAll("audio")
                );

              for (
                var k = 0;
                k < audios.length;
                k++
              ) {

                var audio = audios[k];

                try {

                  if (
                    audio.paused ||
                    audio.currentTime >= 0
                  ) {

                    audio.play()
                      .catch(function (error) {
                        console.log(
                          "Existing audio playback requires interaction:",
                          error
                        );
                      });

                    return;

                  }

                } catch (error) {
                  console.log(error);
                }

              }


              console.log(
                "SmritiAI: existing music control not found."
              );

            }


            /*
             * ------------------------------------------------------
             * LOGOUT
             * ------------------------------------------------------
             */

            function logout() {

              var opened =
                clickOriginalControl([
                  "logout",
                  "log out",
                  "sign out",
                  "signout"
                ]);

              if (opened) {
                return;
              }


              var possibleIds = [
                "logout",
                "logoutBtn",
                "logoutButton",
                "signout",
                "signOut",
                "signOutButton"
              ];

              for (
                var i = 0;
                i < possibleIds.length;
                i++
              ) {

                var element =
                  document.getElementById(
                    possibleIds[i]
                  );

                if (element) {

                  element.click();

                  return;

                }

              }


              console.log(
                "SmritiAI: existing logout control not found."
              );

            }


            /*
             * Connect our small side icons.
             */

            function connectSideControls() {

              var caregiver =
                document.getElementById(
                  "smritiai-caregiver-side-button"
                );

              var music =
                document.getElementById(
                  "smritiai-music-side-button"
                );

              var logoutButton =
                document.getElementById(
                  "smritiai-logout-side-button"
                );


              if (caregiver) {

                caregiver.addEventListener(
                  "click",
                  function (event) {

                    event.preventDefault();
                    event.stopPropagation();

                    openCaregiver();

                  }
                );

              }


              if (music) {

                music.addEventListener(
                  "click",
                  function (event) {

                    event.preventDefault();
                    event.stopPropagation();

                    openMusic();

                  }
                );

              }


              if (logoutButton) {

                logoutButton.addEventListener(
                  "click",
                  function (event) {

                    event.preventDefault();
                    event.stopPropagation();

                    logout();

                  }
                );

              }

            }


            /*
             * Initial setup.
             */

            afterAppLoads(function () {

              connectSideControls();

              hideRudasProgressButton();

            });


            /*
             * The original app is a dynamic application.
             * Watch for screens/buttons being recreated.
             */

            var observer =
              new MutationObserver(
                function () {

                  hideRudasProgressButton();

                }
              );


            afterAppLoads(function () {

              try {

                observer.observe(
                  document.body,
                  {
                    childList: true,
                    subtree: true
                  }
                );

              } catch (error) {

                console.log(
                  "SmritiAI observer error:",
                  error
                );

              }

            });

          })();

          </script>

          '''


          # --------------------------------------------------------
          # Insert safely.
          #
          # IMPORTANT:
          # Do NOT use re.sub(replacement_string) because the
          # JavaScript contains backslashes.
          #
          # lambda prevents Python from interpreting \s, \n etc.
          # --------------------------------------------------------

          pattern = r"</head\s*>"

          updated_html = re.sub(
              pattern,
              lambda match: injection + "\n" + match.group(0),
              html,
              count=1,
              flags=re.IGNORECASE
          )

          if updated_html == html:

              print("WARNING: </head> not found.")

              pattern_body = r"<body[^>]*>"

              updated_html = re.sub(
                  pattern_body,
                  lambda match: match.group(0) + "\n" + injection,
                  html,
                  count=1,
                  flags=re.IGNORECASE
              )


          if updated_html == html:

              print("ERROR: Could not inject UI controls.")
              raise SystemExit(1)


          html_path.write_text(
              updated_html,
              encoding="utf-8"
          )

          final_size = len(updated_html)

          print("")
          print("==========================================")
          print("SMRITIAI UI UPDATE COMPLETE")
          print("==========================================")

          print("Original size:", original_size)
          print("Final size:", final_size)

          print("")
          print("Checking injected controls:")

          checks = [
              "smritiai-side-controls",
              "smritiai-caregiver-side-button",
              "smritiai-music-side-button",
              "smritiai-logout-side-button",
              "smritiai-hide-rudas-floating"
          ]

          for item in checks:

              if item in updated_html:
                  print("OK:", item)
              else:
                  print("ERROR:", item)
                  raise SystemExit(1)

          print("")
          print("Existing RUDAS assessment code was NOT removed.")
          print("Existing music system was NOT removed.")
          print("Existing caregiver functionality was NOT removed.")
          print("Existing logout functionality was NOT removed.")

          PY


